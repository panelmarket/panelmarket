<script>

"use strict";


/* =========================================================
   PANELMARKET ADMIN - OTURUM
========================================================= */

const tokenKey = "panelmarket_token";

let token = null;
let products = [];
let editingId = null;


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

  let value = "";

  try{

    value =
      localStorage.getItem(tokenKey) ||
      sessionStorage.getItem(tokenKey) ||
      "";

  }catch(error){

    console.error(
      "TOKEN OKUMA HATASI:",
      error
    );

  }

  value =
    String(value || "").trim();

  return value || null;

}


/* =========================================================
   ALERT
========================================================= */

function showAlert(message,type="success"){

  const alert =
    document.getElementById("alert");

  if(!alert) return;

  alert.textContent =
    message;

  alert.className =
    "alert show " + type;

  clearTimeout(
    window.alertTimer
  );

  window.alertTimer =
    setTimeout(()=>{

      alert.className =
        "alert";

    },5000);

}


/* =========================================================
   API
========================================================= */

async function api(url,options={}){

  const currentToken =
    getToken();

  const headers = {
    "Accept":"application/json",
    ...(options.headers || {})
  };


  if(options.body !== undefined){

    headers["Content-Type"] =
      "application/json";

  }


  if(currentToken){

    headers["Authorization"] =
      "Bearer " + currentToken;

  }


  const response =
    await fetch(url,{

      ...options,

      headers,

      credentials:"include",

      cache:"no-store"

    });


  let data = {};

  try{

    data =
      await response.json();

  }catch{

    data = {};

  }


  if(!response.ok){

    const error =
      new Error(
        data.error ||
        data.message ||
        `HTTP ${response.status}`
      );

    error.status =
      response.status;

    error.data =
      data;

    throw error;

  }


  return data;

}


/* =========================================================
   ADMIN KONTROLÜ
========================================================= */

async function checkAdmin(){

  const adminUser =
    document.getElementById(
      "adminUser"
    );


  if(adminUser){

    adminUser.textContent =
      "Kontrol ediliyor...";

  }


  /*
   * HER SEFERİNDE GÜNCEL TOKEN
   */

  token =
    getToken();


  console.log(
    "================================"
  );

  console.log(
    "PANELMARKET ADMIN AUTH"
  );

  console.log(
    "TOKEN VAR:",
    !!token
  );


  /*
   * =====================================================
   * 1. TOKEN YOKSA
   * =====================================================
   */

  if(!token){

    console.warn(
      "ADMIN: Token bulunamadı."
    );


    /*
     * Token yok olsa bile cookie ile
     * oturum açılmış olabilir.
     *
     * Bu nedenle HEMEN login.html'ye gitmiyoruz.
     */

  }


  /*
   * =====================================================
   * 2. BEARER TOKEN İLE KONTROL
   * =====================================================
   */

  if(token){

    try{

      console.log(
        "ADMIN: Bearer token kontrol ediliyor..."
      );


      const response =
        await fetch(
          "/api/admin/me?t=" +
          Date.now(),
          {

            method:"GET",

            headers:{
              "Authorization":
                "Bearer " + token,

              "Accept":
                "application/json",

              "Cache-Control":
                "no-cache",

              "Pragma":
                "no-cache"
            },

            credentials:"include",

            cache:"no-store"

          }
        );


      let data = {};


      try{

        data =
          await response.json();

      }catch{

        data = {};

      }


      console.log(
        "ADMIN ME STATUS:",
        response.status
      );


      console.log(
        "ADMIN ME DATA:",
        data
      );


      /*
       * =================================================
       * 200 OK
       * =================================================
       */

      if(response.ok){

        const user =
          data.user ||
          data.admin ||
          data.userData ||
          data;


        console.log(
          "ADMIN USER:",
          user
        );


        const isAdmin =
          data.is_admin === true ||
          data.isAdmin === true ||
          data.admin === true ||
          user.is_admin === true ||
          user.isAdmin === true ||
          user.admin === true;


        console.log(
          "ADMIN IS ADMIN:",
          isAdmin
        );


        if(isAdmin){

          if(adminUser){

            adminUser.textContent =
              user.email ||
              user.name ||
              "Admin";

          }


          /*
           * Kullanıcı bilgilerini güncelle
           */

          try{

            localStorage.setItem(
              "panelmarket_token",
              token
            );


            localStorage.setItem(
              "panelmarket_user",
              JSON.stringify(user)
            );

          }catch(error){

            console.warn(
              "LOCAL STORAGE YAZMA HATASI:",
              error
            );

          }


          /*
           * Server yeni token gönderirse
           */

          if(data.token){

            try{

              localStorage.setItem(
                tokenKey,
                data.token
              );

            }catch{}

            token =
              data.token;

          }


          console.log(
            "================================"
          );

          console.log(
            "ADMIN OTURUMU BAŞARILI"
          );

          console.log(
            "ADMIN:",
            user.email || user.name || "Admin"
          );

          console.log(
            "================================"
          );


          return true;

        }


        /*
         * 200 ama admin değil
         */

        if(adminUser){

          adminUser.textContent =
            "Admin yetkisi yok";

        }


        showAlert(
          "Bu hesap admin olarak tanımlanmamış. Supabase users tablosunda is_admin değerini true yap.",
          "error"
        );


        console.warn(
          "ADMIN: Kullanıcı giriş yapmış fakat admin değil."
        );


        return false;

      }


      /*
       * =================================================
       * 403
       * =================================================
       *
       * Oturum var fakat admin değil.
       */

      if(response.status === 403){

        if(adminUser){

          adminUser.textContent =
            "Admin yetkisi yok";

        }


        showAlert(
          data.error ||
          data.message ||
          "Bu hesabın admin yetkisi yok.",
          "error"
        );


        console.warn(
          "ADMIN: 403 - Admin yetkisi yok."
        );


        /*
         * TOKEN'I SİLME
         */

        return false;

      }


      /*
       * =================================================
       * 401
       * =================================================
       *
       * TOKEN geçersiz olabilir.
       *
       * HEMEN LOGIN'E GİTMİYORUZ.
       * COOKIE'Yİ DE DENİYORUZ.
       */

      if(response.status === 401){

        console.warn(
          "ADMIN: Bearer token 401 döndürdü."
        );

        console.warn(
          "ADMIN: Cookie oturumu ayrıca kontrol edilecek."
        );

      }

    }catch(error){

      console.error(
        "ADMIN BEARER CHECK ERROR:",
        error
      );

    }

  }


  /*
   * =====================================================
   * 3. COOKIE İLE KONTROL
   * =====================================================
   *
   * Burada Authorization header yok.
   *
   * Browser:
   * panelmarket_token cookie
   * gönderiyorsa server bunu kullanacak.
   */

  try{

    console.log(
      "ADMIN: Cookie oturumu kontrol ediliyor..."
    );


    const cookieResponse =
      await fetch(
        "/api/admin/me?cookie=" +
        Date.now(),
        {

          method:"GET",

          headers:{
            "Accept":
              "application/json",

            "Cache-Control":
              "no-cache",

            "Pragma":
              "no-cache"
          },

          credentials:"include",

          cache:"no-store"

        }
      );


    let cookieData = {};


    try{

      cookieData =
        await cookieResponse.json();

    }catch{

      cookieData = {};

    }


    console.log(
      "ADMIN COOKIE STATUS:",
      cookieResponse.status
    );


    console.log(
      "ADMIN COOKIE DATA:",
      cookieData
    );


    /*
     * =================================================
     * COOKIE 200
     * =================================================
     */

    if(cookieResponse.ok){

      const user =
        cookieData.user ||
        cookieData.admin ||
        cookieData.userData ||
        cookieData;


      const isAdmin =
        cookieData.is_admin === true ||
        cookieData.isAdmin === true ||
        cookieData.admin === true ||
        user.is_admin === true ||
        user.isAdmin === true ||
        user.admin === true;


      console.log(
        "COOKIE IS ADMIN:",
        isAdmin
      );


      if(isAdmin){

        if(adminUser){

          adminUser.textContent =
            user.email ||
            user.name ||
            "Admin";

        }


        try{

          localStorage.setItem(
            "panelmarket_user",
            JSON.stringify(user)
          );

        }catch{}


        /*
         * Cookie oturumu çalışıyor.
         */

        console.log(
          "================================"
        );

        console.log(
          "ADMIN COOKIE OTURUMU BAŞARILI"
        );

        console.log(
          "================================"
        );


        return true;

      }


      /*
       * Cookie geçerli ama admin değil.
       */

      if(adminUser){

        adminUser.textContent =
          "Admin yetkisi yok";

      }


      showAlert(
        cookieData.error ||
        cookieData.message ||
        "Bu hesabın admin yetkisi yok.",
        "error"
      );


      return false;

    }


    /*
     * =================================================
     * COOKIE 403
     * =================================================
     */

    if(cookieResponse.status === 403){

      if(adminUser){

        adminUser.textContent =
          "Admin yetkisi yok";

      }


      showAlert(
        cookieData.error ||
        cookieData.message ||
        "Bu hesap admin olarak tanımlanmamış.",
        "error"
      );


      return false;

    }


    /*
     * =================================================
     * COOKIE 401
     * =================================================
     *
     * Buraya geldiysek:
     *
     * 1. Bearer token başarısız
     * 2. Cookie başarısız
     *
     * Artık gerçekten oturum doğrulanamıyor.
     */

    if(cookieResponse.status === 401){

      console.error(
        "================================"
      );

      console.error(
        "ADMIN AUTH BAŞARISIZ"
      );

      console.error(
        "Bearer: 401"
      );

      console.error(
        "Cookie: 401"
      );

      console.error(
        "SERVER:",
        cookieData
      );

      console.error(
        "================================"
      );


      /*
       * Burada token'ı temizliyoruz.
       */

      try{

        localStorage.removeItem(
          tokenKey
        );

        sessionStorage.removeItem(
          tokenKey
        );

        localStorage.removeItem(
          "panelmarket_user"
        );

        sessionStorage.removeItem(
          "panelmarket_user"
        );

      }catch{}


      token = null;


      if(adminUser){

        adminUser.textContent =
          "Oturum bulunamadı";

      }


      showAlert(
        cookieData.error ||
        cookieData.message ||
        "Oturum doğrulanamadı. Lütfen tekrar giriş yapın.",
        "error"
      );


      /*
       * Login'e yönlendirme
       */

      setTimeout(()=>{

        window.location.replace(
          "/login.html"
        );

      },1200);


      return false;

    }


    /*
     * =================================================
     * DİĞER HTTP HATALARI
     * =================================================
     */

    if(adminUser){

      adminUser.textContent =
        "Sunucu hatası";

    }


    showAlert(
      cookieData.error ||
      cookieData.message ||
      "Admin kontrolü sırasında sunucu hatası oluştu.",
      "error"
    );


    console.error(
      "ADMIN HTTP ERROR:",
      cookieResponse.status,
      cookieData
    );


    return false;


  }catch(error){

    console.error(
      "ADMIN COOKIE CHECK ERROR:",
      error
    );


    if(adminUser){

      adminUser.textContent =
        "Bağlantı hatası";

    }


    showAlert(
      "Admin sunucusuna bağlanılamadı: " +
      error.message,
      "error"
    );


    return false;

  }

}


/* =========================================================
   PRODUCTS
========================================================= */

async function loadProducts(){

  const tbody =
    document.getElementById(
      "productsTable"
    );


  tbody.innerHTML = `
    <tr>
      <td colspan="8">
        <div class="loading">
          Ürünler yükleniyor...
        </div>
      </td>
    </tr>
  `;


  try{

    const data =
      await api(
        "/api/admin/products"
      );


    if(Array.isArray(data)){

      products =
        data;

    }else{

      products =
        Array.isArray(data.products)
          ? data.products
          : Array.isArray(data.data)
            ? data.data
            : [];

    }


    renderStats();

    renderProducts();


  }catch(error){

    console.error(
      "ÜRÜNLER YÜKLENEMEDİ:",
      error
    );


    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          <div class="empty">
            Ürünler yüklenemedi.<br><br>
            ${escapeHtml(error.message)}
          </div>
        </td>
      </tr>
    `;


    showAlert(
      error.message ||
      "Ürünler yüklenemedi.",
      "error"
    );

  }

}


/* =========================================================
   STATS
========================================================= */

function renderStats(){

  const total =
    products.length;


  const active =
    products.filter(
      p => p.active !== false
    ).length;


  const passive =
    total - active;


  document.getElementById(
    "totalProducts"
  ).textContent =
    total;


  document.getElementById(
    "activeProducts"
  ).textContent =
    active;


  document.getElementById(
    "passiveProducts"
  ).textContent =
    passive;


  document.getElementById(
    "catalogStatus"
  ).textContent =
    active > 0
      ? "AKTİF"
      : "BOŞ";

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

  const tbody =
    document.getElementById(
      "productsTable"
    );


  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    products.filter(product=>{

      const text = [

        product.id,
        product.name,
        product.category,
        product.description,
        product.badge

      ]
      .join(" ")
      .toLowerCase();


      return text.includes(search);

    });


  if(!filtered.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          <div class="empty">
            ${
              search
                ? "Aramanızla eşleşen ürün bulunamadı."
                : "Henüz ürün bulunmuyor."
            }
          </div>
        </td>
      </tr>
    `;

    return;

  }


  tbody.innerHTML =
    filtered.map(product=>{

      const id =
        product.id || "";


      const name =
        product.name ||
        "İsimsiz ürün";


      const category =
        product.category ||
        "-";


      const price =
        Number(
          product.price || 0
        );


      const oldPrice =
        product.oldPrice ??
        product.old_price;


      const badge =
        product.badge ||
        "";


      const delivery =
        product.delivery ||
        "Hemen";


      const active =
        product.active !== false;


      const sortOrder =
        product.sortOrder ??
        product.sort_order ??
        0;


      return `

<tr>

<td>

<div class="product-name">
${escapeHtml(name)}
</div>

<div class="product-id">
${escapeHtml(id)}
</div>

</td>

<td>
${escapeHtml(category)}
</td>

<td>

<strong>
${formatMoney(price)}
</strong>

${
oldPrice !== null &&
oldPrice !== undefined &&
Number(oldPrice) > 0

? `
<div style="
color:#68778a;
text-decoration:line-through;
font-size:12px;
margin-top:3px;
">
${formatMoney(Number(oldPrice))}
</div>
`

: ""
}

</td>

<td>

${
badge

? `
<span class="badge">
${escapeHtml(badge)}
</span>
`

: `<span style="color:#5f6d80">—</span>`
}

</td>

<td>
${escapeHtml(delivery)}
</td>

<td>

${
active
? `<span class="badge green">AKTİF</span>`
: `<span class="badge red">PASİF</span>`
}

</td>

<td>
${escapeHtml(String(sortOrder))}
</td>

<td>

<div class="actions">

<button
class="action-btn"
onclick="editProduct('${jsEscape(id)}')">
✏️ Düzenle
</button>

<button
class="action-btn"
onclick="toggleProduct('${jsEscape(id)}')">
${active ? "⏸ Pasif" : "▶ Aktif"}
</button>

<button
class="action-btn delete"
onclick="deleteProduct('${jsEscape(id)}')">
🗑 Sil
</button>

</div>

</td>

</tr>

`;

    }).join("");

}

/* =========================================================
   EDIT
========================================================= */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){

    showAlert(
      "Ürün bulunamadı.",
      "error"
    );

    return;

  }


  editingId =
    id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Ürün Düzenle";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "DEĞİŞİKLİKLERİ KAYDET";


  document.getElementById(
    "productId"
  ).value =
    product.id || "";


  document.getElementById(
    "productName"
  ).value =
    product.name || "";


  document.getElementById(
    "productCategory"
  ).value =
    product.category || "";


  document.getElementById(
    "productPrice"
  ).value =
    product.price ?? "";


  document.getElementById(
    "productOldPrice"
  ).value =
    product.oldPrice ??
    product.old_price ??
    "";


  document.getElementById(
    "productBadge"
  ).value =
    product.badge || "";


  document.getElementById(
    "productDelivery"
  ).value =
    product.delivery ||
    "Hemen";


  document.getElementById(
    "productUpdate"
  ).value =
    product.update ??
    product.update_period ??
    "1 Yıl";


  document.getElementById(
    "productSupport"
  ).value =
    product.support ??
    product.support_period ??
    "30 Gün";


  document.getElementById(
    "productSort"
  ).value =
    product.sortOrder ??
    product.sort_order ??
    0;


  document.getElementById(
    "productDescription"
  ).value =
    product.description ||
    "";


  document.getElementById(
    "productActive"
  ).checked =
    product.active !== false;


  document.getElementById(
    "productId"
  ).disabled =
    true;


  openModal();

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(event){

  event.preventDefault();


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  const id =
    document.getElementById(
      "productId"
    ).value.trim();


  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  const category =
    document.getElementById(
      "productCategory"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );


  const oldPriceValue =
    document.getElementById(
      "productOldPrice"
    ).value;


  const oldPrice =
    oldPriceValue === ""
      ? null
      : Number(oldPriceValue);


  const badge =
    document.getElementById(
      "productBadge"
    ).value.trim();


  const delivery =
    document.getElementById(
      "productDelivery"
    ).value.trim();


  const updatePeriod =
    document.getElementById(
      "productUpdate"
    ).value.trim();


  const support =
    document.getElementById(
      "productSupport"
    ).value.trim();


  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();


  const sortOrder =
    Number(
      document.getElementById(
        "productSort"
      ).value || 0
    );


  const active =
    document.getElementById(
      "productActive"
    ).checked;


  if(!id){

    showAlert(
      "Ürün ID gerekli.",
      "error"
    );

    return;

  }


  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)){

    showAlert(
      "Ürün ID sadece küçük harf, rakam ve tire içerebilir.",
      "error"
    );

    return;

  }


  if(!name){

    showAlert(
      "Ürün adı gerekli.",
      "error"
    );

    return;

  }


  if(!category){

    showAlert(
      "Kategori gerekli.",
      "error"
    );

    return;

  }


  if(!Number.isFinite(price) || price <= 0){

    showAlert(
      "Geçerli bir fiyat gir.",
      "error"
    );

    return;

  }


  if(
    oldPrice !== null &&
    (
      !Number.isFinite(oldPrice) ||
      oldPrice < 0
    )
  ){

    showAlert(
      "Eski fiyat geçersiz.",
      "error"
    );

    return;

  }


  if(
    !Number.isInteger(sortOrder) ||
    sortOrder < 0
  ){

    showAlert(
      "Sıralama değeri geçersiz.",
      "error"
    );

    return;

  }


  const payload = {

    id,

    name,

    category,

    description,

    price,

    oldPrice,

    old_price:
      oldPrice,

    badge,

    delivery:
      delivery || "Hemen",

    update:
      updatePeriod || "1 Yıl",

    update_period:
      updatePeriod || "1 Yıl",

    support:
      support || "30 Gün",

    active,

    sortOrder,

    sort_order:
      sortOrder

  };


  const wasEditing =
    Boolean(editingId);


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "KAYDEDİLİYOR...";


  try{

    if(wasEditing){

      await api(
        "/api/admin/products/" +
        encodeURIComponent(
          editingId
        ),
        {

          method:"PUT",

          body:
            JSON.stringify(
              payload
            )

        }
      );


      showAlert(
        "Ürün başarıyla güncellendi."
      );

    }else{

      await api(
        "/api/admin/products",
        {

          method:"POST",

          body:
            JSON.stringify(
              payload
            )

        }
      );


      showAlert(
        "Yeni ürün başarıyla eklendi."
      );

    }


    closeModal();

    await loadProducts();


  }catch(error){

    console.error(
      "ÜRÜN KAYDETME HATASI:",
      error
    );


    showAlert(
      error.message ||
      "Ürün kaydedilemedi.",
      "error"
    );

  }finally{

    saveBtn.disabled =
      false;


    saveBtn.textContent =
      wasEditing
        ? "DEĞİŞİKLİKLERİ KAYDET"
        : "ÜRÜNÜ KAYDET";

  }

}


/* =========================================================
   TOGGLE PRODUCT
========================================================= */

async function toggleProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){

    showAlert(
      "Ürün bulunamadı.",
      "error"
    );

    return;

  }


  const newStatus =
    product.active === false;


  if(!confirm(
    `"${product.name}" ürününü ${
      newStatus
        ? "aktif"
        : "pasif"
    } yapmak istiyor musun?`
  )){

    return;

  }


  try{

    await api(
      "/api/admin/products/" +
      encodeURIComponent(id),
      {

        method:"PUT",

        body:
          JSON.stringify({
            active:
              newStatus
          })

      }
    );


    showAlert(
      newStatus
        ? "Ürün aktif edildi."
        : "Ürün pasif edildi."
    );


    await loadProducts();


  }catch(error){

    console.error(
      "ÜRÜN DURUMU HATASI:",
      error
    );


    showAlert(
      error.message ||
      "Ürün durumu değiştirilemedi.",
      "error"
    );

  }

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){

    showAlert(
      "Ürün bulunamadı.",
      "error"
    );

    return;

  }


  if(!confirm(
    `"${product.name}" ürününü kalıcı olarak silmek istediğine emin misin?\n\nBu işlem geri alınamaz.`
  )){

    return;

  }


  try{

    await api(
      "/api/admin/products/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );


    showAlert(
      "Ürün silindi."
    );


    await loadProducts();


  }catch(error){

    console.error(
      "ÜRÜN SİLME HATASI:",
      error
    );


    showAlert(
      error.message ||
      "Ürün silinemedi.",
      "error"
    );

  }

}

/* =========================================================
   MONEY
========================================================= */

function formatMoney(value){

  return new Intl.NumberFormat(
    "tr-TR",
    {

      style:"currency",

      currency:"TRY",

      minimumFractionDigits:2

    }
  ).format(
    Number(value) || 0
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function jsEscape(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    "\n",
    "\\n"
  )
  .replaceAll(
    "\r",
    "\\r"
  );

}
