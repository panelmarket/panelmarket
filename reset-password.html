<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Şifre Sıfırla - PanelMarket</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#070a0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.box{
  width:100%;
  max-width:430px;
  padding:32px;
  border:1px solid #1d2835;
  border-radius:22px;
  background:#0d131b;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.title{
  font-size:21px;
  font-weight:800;
  margin-top:24px;
}

.desc{
  color:#8d98a8;
  line-height:1.5;
  font-size:14px;
  margin:10px 0 22px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#cbd5e1;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #263342;
  background:#111821;
  color:#fff;
  outline:none;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#1677ff;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  margin-top:15px;
  font-size:14px;
  line-height:1.5;
}

.back{
  display:block;
  margin-top:18px;
  text-align:center;
  color:#8d98a8;
  text-decoration:none;
  font-size:14px;
}

</style>

</head>

<body>

<div class="box">

  <div class="logo">
    PanelMarket
  </div>

  <div class="title">
    Yeni Şifre Belirle
  </div>

  <div class="desc">
    Hesabınız için yeni şifrenizi oluşturun.
  </div>

  <label for="newPassword">
    Yeni Şifre
  </label>

  <input
    id="newPassword"
    type="password"
    autocomplete="new-password"
    placeholder="Yeni şifreniz"
  >

  <label for="newPasswordAgain">
    Yeni Şifre Tekrar
  </label>

  <input
    id="newPasswordAgain"
    type="password"
    autocomplete="new-password"
    placeholder="Yeni şifrenizi tekrar girin"
  >

  <button
    id="resetButton"
    type="button"
    onclick="resetPassword()"
  >
    Şifreyi Sıfırla
  </button>

  <div id="message"></div>

  <a
    class="back"
    href="/login.html"
  >
    Giriş sayfasına dön
  </a>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get("token") || "";


async function resetPassword(){

  const password =
    document.getElementById(
      "newPassword"
    ).value;

  const passwordAgain =
    document.getElementById(
      "newPasswordAgain"
    ).value;

  const button =
    document.getElementById(
      "resetButton"
    );

  const message =
    document.getElementById(
      "message"
    );

  if (!token) {

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Şifre sıfırlama bağlantısı geçersiz.";

    button.disabled = true;

    return;
  }

  if (
    password.length < 8 ||
    !/[A-Za-z]/.test(password) ||
    !/[0-9]/.test(password)
  ) {

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Şifre en az 8 karakter ve harf/rakam içermelidir.";

    return;
  }

  if (password !== passwordAgain) {

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Şifreler aynı değil.";

    return;
  }

  button.disabled = true;

  button.textContent =
    "Güncelleniyor...";

  try {

    const response =
      await fetch(
        "/api/reset-password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            token,
            newPassword:password
          })
        }
      );

    const data =
      await response.json()
        .catch(() => ({}));

    if (!response.ok) {

      message.style.color =
        "#ff6b6b";

      message.textContent =
        data.error ||
        "Şifre sıfırlanamadı.";

      button.disabled = false;

      button.textContent =
        "Şifreyi Sıfırla";

      return;
    }

    message.style.color =
      "#35d07f";

    message.textContent =
      data.message ||
      "Şifreniz başarıyla sıfırlandı.";

    button.textContent =
      "Tamamlandı";

    setTimeout(() => {

      window.location.href =
        "/login.html";

    }, 1800);

  } catch (error) {

    console.error(
      "RESET PASSWORD:",
      error
    );

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Sunucuya ulaşılamadı.";

    button.disabled = false;

    button.textContent =
      "Şifreyi Sıfırla";
  }

}


/* Sayfa açılır açılmaz token yoksa göster */

if (!token) {

  const message =
    document.getElementById(
      "message"
    );

  const button =
    document.getElementById(
      "resetButton"
    );

  message.style.color =
    "#ff6b6b";

  message.textContent =
    "Şifre sıfırlama bağlantısı eksik veya geçersiz.";

  button.disabled = true;
}

</script>

</body>
</html>
