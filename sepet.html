<script>


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHtml(value){

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


/* =========================================
   FİYAT
========================================= */

function format(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "tr-TR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================
   TOKEN
========================================= */

function getToken(){

    return (
        localStorage.getItem(
            "panelmarket_token"
        ) ||
        sessionStorage.getItem(
            "panelmarket_token"
        ) ||
        ""
    );

}


/* =========================================
   HEADER GİRİŞ
========================================= */

function showLoggedIn(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );

    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.setProperty(
            "display",
            "none",
            "important"
        );

    }


    if(userButtons){

        userButtons.style.setProperty(
            "display",
            "flex",
            "important"
        );

    }

}


/* =========================================
   HEADER ÇIKIŞ
========================================= */

function showLoggedOut(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );

    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.setProperty(
            "display",
            "flex",
            "important"
        );

    }


    if(userButtons){

        userButtons.style.setProperty(
            "display",
            "none",
            "important"
        );

    }

}


/* =========================================
   OTURUM KONTROLÜ
========================================= */

async function checkLogin(){

    const token =
        getToken();


    try{

        const headers = {

            "Accept":
                "application/json"

        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        const response =
            await fetch(
                "/api/auth/me?t=" +
                Date.now(),
                {
                    method:"GET",

                    headers:headers,

                    credentials:"include",

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    ()=>({})
                );


        if(
            response.ok &&
            data &&
            data.authenticated === true &&
            data.user
        ){

            showLoggedIn();


            try{

                localStorage.setItem(
                    "panelmarket_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }catch(error){

                console.warn(
                    "Kullanıcı bilgisi kaydedilemedi:",
                    error
                );

            }

        }else{

            showLoggedOut();

        }


    }catch(error){

        console.error(
            "Oturum kontrolü başarısız:",
            error
        );


        if(token){

            showLoggedIn();

        }else{

            showLoggedOut();

        }

    }

}


/* =========================================
   ÇIKIŞ
========================================= */

async function logoutUser(){

    const token =
        getToken();


    try{

        const headers = {

            "Accept":
                "application/json"

        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        await fetch(
            "/api/logout",
            {
                method:"POST",

                headers:headers,

                credentials:"include",

                cache:"no-store"
            }
        );


    }catch(error){

        console.error(
            "Çıkış API hatası:",
            error
        );


    }finally{

        try{

            localStorage.removeItem(
                "panelmarket_token"
            );

            localStorage.removeItem(
                "panelmarket_user"
            );

            sessionStorage.removeItem(
                "panelmarket_token"
            );

            sessionStorage.removeItem(
                "panelmarket_user"
            );

        }catch(error){

            console.warn(
                "Oturum temizleme hatası:",
                error
            );

        }


        showLoggedOut();


        window.location.replace(
            "/index.html"
        );

    }

}


/* =========================================
   ÜRÜN GÖRSELİ
   URUN.HTML İLE AYNI
========================================= */

function createProductImage(
    imageUrl,
    productName
){

    const url =
        String(
            imageUrl || ""
        ).trim();


    if(!url){

        return `
            <div class="image-fallback">
                ▣
            </div>
        `;

    }


    return `

        <img
            src="${escapeHtml(url)}"
            alt="${escapeHtml(
                productName || "Ürün"
            )}"

            onerror="
                this.style.display='none';
                if(this.nextElementSibling){
                    this.nextElementSibling.style.display='flex';
                }
            "
        >

        <div
            class="image-fallback"
            style="display:none;"
        >
            ▣
        </div>

    `;

}


/* =========================================
   SEPET GÖRSEL URL'Sİ
   TÜM ALANLARI DESTEKLER
========================================= */

function getCartImageUrl(cart){

    if(
        !cart ||
        typeof cart !== "object"
    ){

        return "";

    }


    return String(

        cart.image_url ||

        cart.imageUrl ||

        cart.image ||

        cart.thumbnail ||

        ""

    ).trim();

}


/* =========================================
   SEPETİ AL
========================================= */

function getCart(){

    try{

        const raw =
            localStorage.getItem(
                "panelmarket_cart"
            );

        if(!raw){

            return null;

        }

        return JSON.parse(raw);

    }catch(error){

        console.error(
            "Sepet okunamadı:",
            error
        );

        return null;

    }

}


/* =========================================
   SEPETİ TEMİZLE
========================================= */

function clearCart(){

    try{

        localStorage.removeItem(
            "panelmarket_cart"
        );

        localStorage.removeItem(
            "panelmarket_selected_license"
        );

    }catch(error){

        console.warn(
            "Sepet temizleme hatası:",
            error
        );

    }


    renderCart();

}


/* =========================================
   SEPETİ GÖSTER
========================================= */

function renderCart(){

    const content =
        document.getElementById(
            "content"
        );

    if(!content){

        return;

    }


    const cart =
        getCart();


    if(!cart){

        content.innerHTML = `

            <div class="card empty-cart">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Sepetiniz boş
                </h2>

                <p>
                    Henüz satın almak istediğiniz
                    bir ürün bulunmuyor.
                </p>

                <a
                    href="/index.html"
                    class="btn primary"
                >
                    ALIŞVERİŞE BAŞLA
                </a>

            </div>

        `;

        return;

    }


    const productName =
        String(
            cart.productName ||
            cart.name ||
            cart.title ||
            "Ürün"
        );


    const price =
        Number(
            cart.price || 0
        );


    const licenseName =
        String(
            cart.licenseName ||
            cart.license ||
            "1 Site"
        );


    const imageUrl =
        getCartImageUrl(
            cart
        );

/* =========================================
   ESKİ SEPETTE GÖRSEL YOKSA
   ÜRÜN API'DEN GÖRSELİ AL
========================================= */

async function loadMissingCartImage(cart){

    try{

        const response =
            await fetch(

                "/api/products/" +

                encodeURIComponent(
                    cart.productId
                ) +

                "?t=" +

                Date.now(),

                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    credentials:"include",

                    cache:"no-store"
                }

            );


        if(!response.ok){

            return;

        }


        const data =
            await response
                .json()
                .catch(
                    ()=>null
                );


        const product =

            data?.product ||

            data?.data ||

            data;


        if(
            !product ||
            typeof product !== "object"
        ){

            return;

        }


        const imageUrl = String(

            product.image_url ||

            product.imageUrl ||

            product.image ||

            product.thumbnail ||

            ""

        ).trim();


        if(!imageUrl){

            return;

        }


        /*
         * GÖRSELİ ESKİ SEPETE GERİ YAZ
         */

        cart.image_url =
            imageUrl;


        localStorage.setItem(

            "panelmarket_cart",

            JSON.stringify(
                cart
            )

        );


        /*
         * TEKRAR GÖSTER
         */

        renderCart();


    }catch(error){

        console.warn(

            "Sepet ürün görseli alınamadı:",

            error

        );

    }

}
