<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#070a0f;
    color:#f5f7fb
}

a{
    text-decoration:none;
    color:inherit
}

button,
input,
select{
    font-family:inherit
}


/* =========================================
   HEADER
========================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:76px;
    background:rgba(7,10,15,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #1c2531
}

.header{
    width:min(1200px,94%);
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:21px;
    font-weight:900
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#1677ff,#7347ff);
    box-shadow:0 8px 30px rgba(22,119,255,.25)
}

.nav{
    display:flex;
    gap:28px
}

.nav a{
    color:#8995a7;
    font-size:13px
}

.nav a:hover{
    color:#fff
}


/* =========================================
   INDEX.HTML HEADER BUTONLARI
========================================= */

#headerButtons{
    display:flex;
    align-items:center;
}

#guestButtons,
#userButtons{
    display:flex;
    align-items:center;
    gap:10px;
}

#guestButtons .btn,
#userButtons .btn{
    box-sizing:border-box;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    height:42px;
    padding:11px 16px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

#guestButtons .btn.outline,
#userButtons .btn.outline{
    border:1px solid #273241;
}

#guestButtons .btn.blue,
#userButtons .btn.blue{
    border:1px solid #1677ff;
}

#userButtons button.btn{
    font-family:inherit;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
}


/* =========================================
   ÜRÜN
========================================= */

.container{
    width:min(1200px,94%);
    margin:40px auto 80px
}

.back{
    display:inline-block;
    color:#6f7d90;
    font-size:13px;
    margin-bottom:20px
}

.back:hover{
    color:#fff
}

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px
}

.card{
    background:#0d131b;
    border:1px solid #1c2633;
    border-radius:18px
}


/* =========================================
   ÜRÜN GÖRSEL ALANI
========================================= */

.preview{
    min-height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(40,130,255,.23),
            transparent 55%
        ),
        #101722;
}

.preview.has-image{
    padding:20px;
}

.preview-screen{
    width:300px;
    height:190px;
    border-radius:15px;
    background:#0b1119;
    border:1px solid #33445a;
    padding:18px;
    box-shadow:0 20px 70px rgba(22,119,255,.18)
}

.product-preview-image{
    width:100%;
    height:390px;
    max-width:100%;
    display:block;
    object-fit:contain;
    border-radius:14px;
}

.top-line{
    height:10px;
    width:42%;
    border-radius:8px;
    background:#268cff;
    margin-bottom:20px
}

.lines{
    display:grid;
    gap:12px
}

.lines i{
    height:9px;
    display:block;
    background:#28384b;
    border-radius:8px
}

.detail{
    padding:30px
}

.category{
    color:#5eacff;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase
}

h1{
    font-size:38px;
    line-height:1.1;
    margin-top:10px
}

.description{
    color:#778497;
    font-size:14px;
    line-height:1.7;
    margin-top:15px
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:22px
}

.info-box{
    padding:13px;
    border-radius:9px;
    background:#0b1118;
    border:1px solid #192330
}

.info-box small{
    display:block;
    color:#59687b;
    font-size:9px
}

.info-box b{
    display:block;
    margin-top:5px;
    font-size:12px
}

.license-title{
    margin-top:28px;
    font-size:14px
}

.licenses{
    display:grid;
    gap:9px;
    margin-top:12px
}

.license{
    position:relative;
    cursor:pointer
}

.license input{
    position:absolute;
    opacity:0
}

.license-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border:1px solid #202b39;
    background:#0b1118;
    border-radius:10px;
    transition:.2s
}

.license input:checked + .license-box{
    border-color:#1677ff;
    background:rgba(22,119,255,.09);
    box-shadow:0 0 0 1px rgba(22,119,255,.2)
}

.license-name{
    font-weight:800;
    font-size:13px
}

.license-price{
    font-weight:900;
    color:#fff
}

.buy-area{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-top:25px
}

.price strong{
    font-size:28px
}

.buy{
    border:0;
    padding:14px 22px;
    border-radius:10px;
    background:#1677ff;
    color:#fff;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 12px 35px rgba(22,119,255,.22)
}

.buy:hover{
    background:#298cff
}


/* =========================================
   ÜRÜN YÜKLENİYOR
========================================= */

.product-loading{
    opacity:.65;
}

.product-error{
    color:#ff6b6b !important;
}


/* =========================================
   MOBİL
========================================= */

@media(max-width:800px){

    .product-detail{
        grid-template-columns:1fr
    }

    .preview{
        min-height:300px
    }

    .preview.has-image{
        padding:15px;
    }

    .product-preview-image{
        height:270px;
    }

    .nav{
        display:none
    }

}

@media(max-width:700px){

    #guestButtons,
    #userButtons{
        gap:8px;
    }

    #guestButtons .btn,
    #userButtons .btn{
        min-height:40px;
        height:40px;
        padding:10px 13px;
        font-size:12px;
    }

}

@media(max-width:500px){

    .detail{
        padding:22px
    }

    h1{
        font-size:30px
    }

    .info{
        grid-template-columns:1fr
    }

    .buy-area{
        align-items:stretch;
        flex-direction:column
    }

    .buy{
        text-align:center
    }

    .preview{
        min-height:280px;
    }

    .product-preview-image{
        height:240px;
    }

}

</style>

</head>

<script>


/* =========================================
   OTURUM KONTROLÜ
========================================= */

async function checkLogin(){

    const token =
        localStorage.getItem(
            "panelmarket_token"
        ) ||
        sessionStorage.getItem(
            "panelmarket_token"
        ) ||
        "";


    try{

        const headers = {
            "Accept":"application/json"
        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        const response =
            await fetch(
                "/api/auth/me?t=" +
                Date.now(),
                {
                    method:"GET",
                    headers:headers,
                    credentials:"include",
                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(()=>({}));


        if(
            response.ok &&
            data &&
            data.authenticated === true &&
            data.user
        ){

            showLoggedIn();


            try{

                localStorage.setItem(
                    "panelmarket_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }catch(error){}

        }else{

            showLoggedOut();

        }


    }catch(error){

        console.error(
            "Oturum kontrolü başarısız:",
            error
        );


        const savedUser =
            localStorage.getItem(
                "panelmarket_user"
            );


        const savedToken =
            localStorage.getItem(
                "panelmarket_token"
            );


        if(
            savedUser &&
            savedToken
        ){

            showLoggedIn();

        }else{

            showLoggedOut();

        }

    }

}



/* =========================================
   GİRİŞ YAPILMIŞ
========================================= */

function showLoggedIn(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );


    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.display =
            "none";

    }


    if(userButtons){

        userButtons.style.display =
            "flex";

    }

}



/* =========================================
   GİRİŞ YAPILMAMIŞ
========================================= */

function showLoggedOut(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );


    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.display =
            "flex";

    }


    if(userButtons){

        userButtons.style.display =
            "none";

    }

}



/* =========================================
   ÇIKIŞ YAP
========================================= */

async function logoutUser(){

    try{

        const token =
            localStorage.getItem(
                "panelmarket_token"
            ) ||
            sessionStorage.getItem(
                "panelmarket_token"
            ) ||
            "";


        const headers = {
            "Accept":
                "application/json"
        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        await fetch(
            "/api/logout",
            {
                method:"POST",
                headers:headers,
                credentials:"include",
                cache:"no-store"
            }
        );


    }catch(error){

        console.error(
            "Çıkış API hatası:",
            error
        );


    }finally{


        try{

            localStorage.removeItem(
                "panelmarket_token"
            );

            localStorage.removeItem(
                "panelmarket_user"
            );

            sessionStorage.removeItem(
                "panelmarket_token"
            );

            sessionStorage.removeItem(
                "panelmarket_user"
            );

        }catch(error){

            console.error(
                "Oturum temizleme hatası:",
                error
            );

        }


        window.location.href =
            "/index.html";

    }

}



/* =========================================
   ÜRÜN ID
========================================= */

const params =
    new URLSearchParams(
        location.search
    );


const id =
    params.get("id") ||
    "admin-panel";


let product = null;

let prices = {
    "1-site":0,
    "3-site":0,
    "unlimited":0
};



/* =========================================
   FİYAT GÜNCELLE
========================================= */

function updatePrice(){

    const selected =
        document.querySelector(
            'input[name="license"]:checked'
        );


    if(!selected){

        return;

    }


    const price =
        prices[selected.value] || 0;


    document.getElementById(
        "productPrice"
    ).textContent =
        "₺" +
        Number(price).toLocaleString(
            "tr-TR"
        );


    document.getElementById(
        "price1"
    ).textContent =
        "₺" +
        Number(
            prices["1-site"] || 0
        ).toLocaleString(
            "tr-TR"
        );


    document.getElementById(
        "price3"
    ).textContent =
        "₺" +
        Number(
            prices["3-site"] || 0
        ).toLocaleString(
            "tr-TR"
        );


    document.getElementById(
        "priceUnlimited"
    ).textContent =
        "₺" +
        Number(
            prices["unlimited"] || 0
        ).toLocaleString(
            "tr-TR"
        );

}



/* =========================================
   ÜRÜN GÖRSELİNİ GÖSTER
========================================= */

function showProductImage(imageUrl){

    const preview =
        document.getElementById(
            "productPreview"
        );


    const image =
        document.getElementById(
            "productImage"
        );


    const defaultPreview =
        document.getElementById(
            "defaultPreview"
        );


    if(
        imageUrl &&
        String(imageUrl).trim()
    ){

        image.src =
            String(imageUrl).trim();


        image.alt =
            product?.name ||
            "Ürün görseli";


        image.style.display =
            "block";


        defaultPreview.style.display =
            "none";


        preview.classList.add(
            "has-image"
        );


        image.onload = function(){

            image.style.display =
                "block";


            defaultPreview.style.display =
                "none";


            preview.classList.add(
                "has-image"
            );

        };


        image.onerror = function(){

            console.error(
                "Ürün görseli yüklenemedi:",
                imageUrl
            );


            image.style.display =
                "none";


            defaultPreview.style.display =
                "block";


            preview.classList.remove(
                "has-image"
            );

        };

    }else{

        image.style.display =
            "none";


        defaultPreview.style.display =
            "block";


        preview.classList.remove(
            "has-image"
        );

    }

}



/* =========================================
   ÜRÜNÜ API'DEN GETİR
========================================= */

async function loadProduct(){

    const nameElement =
        document.getElementById(
            "productName"
        );


    const descriptionElement =
        document.getElementById(
            "productDescription"
        );


    nameElement.classList.add(
        "product-loading"
    );


    try{

        const response =
            await fetch(
                "/api/products/" +
                encodeURIComponent(id) +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    credentials:"include",
                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(()=>({}));


        if(!response.ok){

            throw new Error(
                data.error ||
                "Ürün bulunamadı."
            );

        }


        if(
            !data ||
            !data.id
        ){

            throw new Error(
                "Ürün bilgisi alınamadı."
            );

        }


        product = data;


        /* =================================
           ÜRÜN BİLGİLERİ
        ================================= */

        document.getElementById(
            "productName"
        ).textContent =
            product.name || "";


        document.getElementById(
            "productCategory"
        ).textContent =
            product.category || "";


        document.getElementById(
            "productDescription"
        ).textContent =
            product.description || "";


        document.getElementById(
            "productDelivery"
        ).textContent =
            product.delivery ||
            "Hemen";


        document.getElementById(
            "productUpdate"
        ).textContent =
            product.update ||
            "1 Yıl";


        document.getElementById(
            "productSupport"
        ).textContent =
            product.support ||
            "30 Gün";


        /* =================================
           GÖRSEL
        ================================= */

        showProductImage(
            product.image_url || ""
        );


        /* =================================
           FİYATLAR
        ================================= */

        const basePrice =
            Number(
                product.price || 0
            );


        prices = {

            "1-site":
                basePrice,

            "3-site":
                Math.round(
                    basePrice * 1.667
                ),

            "unlimited":
                Math.round(
                    basePrice * 3.334
                )

        };


        updatePrice();


        nameElement.classList.remove(
            "product-loading"
        );


        descriptionElement.classList.remove(
            "product-error"
        );


        /* =================================
           LİSANS DEĞİŞİKLİKLERİ
        ================================= */

        document.querySelectorAll(
            'input[name="license"]'
        ).forEach(input=>{

            input.onchange =
                updatePrice;

        });


    }catch(error){

        console.error(
            "ÜRÜN YÜKLEME HATASI:",
            error
        );


        nameElement.textContent =
            "Ürün bulunamadı";


        descriptionElement.textContent =
            error.message ||
            "Bu ürün artık mevcut değil.";


        descriptionElement.classList.add(
            "product-error"
        );


        document.getElementById(
            "productCategory"
        ).textContent =
            "ÜRÜN BULUNAMADI";


        document.getElementById(
            "productDelivery"
        ).textContent =
            "-";


        document.getElementById(
            "productUpdate"
        ).textContent =
            "-";


        document.getElementById(
            "productSupport"
        ).textContent =
            "-";


        document.getElementById(
            "price1"
        ).textContent =
            "₺0";


        document.getElementById(
            "price3"
        ).textContent =
            "₺0";


        document.getElementById(
            "priceUnlimited"
        ).textContent =
            "₺0";


        document.getElementById(
            "productPrice"
        ).textContent =
            "₺0";


        const image =
            document.getElementById(
                "productImage"
            );


        const defaultPreview =
            document.getElementById(
                "defaultPreview"
            );


        if(image){

            image.style.display =
                "none";

        }


        if(defaultPreview){

            defaultPreview.style.display =
                "block";

        }

    }

}



/* =========================================
   SEPETE EKLE
========================================= */

document.getElementById(
    "addToCart"
).onclick=()=>{

    if(!product){

        alert(
            "Ürün bilgileri henüz yüklenmedi."
        );

        return;

    }


    const selected =
        document.querySelector(
            'input[name="license"]:checked'
        );


    if(!selected){

        alert(
            "Lütfen bir lisans seçin."
        );

        return;

    }


    const selectedPrice =
        prices[
            selected.value
        ] || 0;


    const licenseNameElement =
        selected.parentElement
            .querySelector(
                ".license-name"
            );


    const cart={

        productId:
            product.id,

        productName:
            product.name,

        licenseId:
            selected.value,

        licenseName:
            licenseNameElement
                ? licenseNameElement
                    .textContent
                    .trim()
                : selected.value,

        price:
            selectedPrice

    };


    localStorage.setItem(
        "panelmarket_cart",
        JSON.stringify(cart)
    );


    location.href =
        "/sepet.html";

};
