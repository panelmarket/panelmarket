<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>Ürün - PanelMarket</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#070a0f;
    color:#f5f7fb;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}


/* =========================================
   HEADER
========================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:76px;
    background:rgba(7,10,15,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #1c2531;
}

.header{
    width:min(1200px,94%);
    height:100%;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;

    font-size:21px;
    font-weight:900;

    flex-shrink:0;
}

.logo-icon{
    width:40px;
    height:40px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:linear-gradient(
        135deg,
        #1677ff,
        #7347ff
    );

    box-shadow:
        0 8px 30px
        rgba(22,119,255,.25);
}


/* =========================================
   NAV
========================================= */

.nav{
    display:flex;
    gap:28px;
    align-items:center;
}

.nav a{
    color:#8995a7;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
}

.nav a:hover{
    color:#fff;
}


/* =========================================
   HEADER BUTONLARI
========================================= */

.header-buttons{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-shrink:0;
}

#guestButtons,
#userButtons{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
}


/* =========================================
   HEADER BUTON TEMELİ
========================================= */

#headerButtons a.btn,
#headerButtons button.btn{

    box-sizing:border-box !important;

    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    width:auto !important;
    min-width:0 !important;

    min-height:42px !important;
    height:42px !important;

    padding:11px 16px !important;

    margin:0 !important;

    border-radius:9px !important;

    font-family:Inter,Arial,sans-serif !important;

    font-size:12px !important;
    font-weight:800 !important;

    line-height:1 !important;

    letter-spacing:normal !important;

    white-space:nowrap !important;

    text-decoration:none !important;
    text-transform:none !important;

    box-shadow:none !important;

    opacity:1 !important;

    outline:none !important;

    cursor:pointer;
}


/* =========================================
   GİRİŞ YAP
========================================= */

#headerButtons #guestButtons a.btn.outline{

    background:transparent !important;
    background-color:transparent !important;

    border:1px solid #273241 !important;

    color:#fff !important;

}

#headerButtons #guestButtons a.btn.outline:hover{

    background:#101720 !important;
    background-color:#101720 !important;

    border-color:#344255 !important;

    color:#fff !important;

}


/* =========================================
   KAYIT OL
========================================= */

#headerButtons #guestButtons a.btn.blue{

    background:#1677ff !important;
    background-color:#1677ff !important;

    border:1px solid #1677ff !important;

    color:#fff !important;

}

#headerButtons #guestButtons a.btn.blue:hover{

    background:#1677ff !important;
    background-color:#1677ff !important;

    border-color:#1677ff !important;

}


/* =========================================
   HESABIM
========================================= */

#headerButtons #userButtons a.btn.outline{

    box-sizing:border-box !important;

    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    width:auto !important;
    min-width:0 !important;

    min-height:42px !important;
    height:42px !important;

    padding:11px 16px !important;

    margin:0 !important;

    border-radius:9px !important;

    background:transparent !important;
    background-color:transparent !important;

    border:1px solid #273241 !important;

    color:#fff !important;

    font-family:Inter,Arial,sans-serif !important;

    font-size:12px !important;
    font-weight:800 !important;

    line-height:1 !important;

    white-space:nowrap !important;

    text-decoration:none !important;

    box-shadow:none !important;

}

#headerButtons #userButtons a.btn.outline:hover{

    background:#101720 !important;
    background-color:#101720 !important;

    border-color:#344255 !important;

    color:#fff !important;

}


/* =========================================
   SEPET
========================================= */

#headerButtons #userButtons .cart-button{

    display:inline-flex !important;

    min-height:42px !important;

    margin:0 !important;

    border-radius:9px !important;

    background:#101720 !important;

    border:1px solid #273241 !important;

    color:#fff !important;

    font-family:Inter,Arial,sans-serif !important;

    font-size:12px !important;
    font-weight:800 !important;

    line-height:1 !important;

    white-space:nowrap !important;

    text-decoration:none !important;

    box-shadow:none !important;

}

#headerButtons #userButtons .cart-button:hover{

    background:#151f2b !important;

    color:#fff !important;

/* =========================================
   ÇIKIŞ YAP
========================================= */

#headerButtons #userButtons button.btn.blue.logout-button{

    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    width:auto !important;
    min-width:0 !important;

    min-height:42px !important;
    height:42px !important;

    padding:11px 16px !important;

    margin:0 !important;

    border-radius:9px !important;

    background:#1677ff !important;
    background-color:#1677ff !important;

    font-family:Inter,Arial,sans-serif !important;

    font-size:12px !important;
    font-weight:800 !important;

    line-height:1 !important;

    letter-spacing:normal !important;

    white-space:nowrap !important;

    text-decoration:none !important;

    box-shadow:none !important;

    cursor:pointer !important;

/* =========================================
   MOBİL HEADER
========================================= */

@media(max-width:850px){

/* =========================================
   SAYFA
========================================= */

    width:min(1100px,94%);

    margin:45px auto 90px;

}

.page-title{

    margin-bottom:25px;

}

.page-title h1{

    font-size:36px;

    letter-spacing:-1.5px;

}

.page-title p{

    margin-top:8px;

    color:#8995a7;

}


/* =========================================
   ÜRÜN ALANI
========================================= */

    display:grid;

    grid-template-columns:
        minmax(0,1fr)

/* =========================================
   CARD
========================================= */

/* =========================================
   ÜRÜN GÖRSELİ
========================================= */

    border-radius:inherit;

}

.image-fallback{

    display:flex;

<script>

/* =========================================
   SABİTLER
========================================= */

const content =
    document.getElementById("content");


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHtml(value){

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


/* =========================================
   FİYAT
========================================= */

function format(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "tr-TR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================
   ÜRÜN ID
========================================= */

function getProductId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("productId") ||
        ""
    ).trim();

}


/* =========================================
   OTURUM TOKEN
========================================= */

function getToken(){

    return (
        localStorage.getItem(
            "panelmarket_token"
        ) ||
        sessionStorage.getItem(
            "panelmarket_token"
        ) ||
        ""
    );

}


/* =========================================
   GİRİŞ YAPILMIŞ HEADER
========================================= */

function showLoggedIn(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );

    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.setProperty(
            "display",
            "none",
            "important"
        );

    }


    if(userButtons){

        userButtons.style.setProperty(
            "display",
            "flex",
            "important"
        );

    }

/* =========================================

========================================= */

async function checkLogin(){

    const token =
        getToken();


    try{

        const headers = {

            "Accept":
                "application/json"

        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        const response =
            await fetch(
                "/api/auth/me?t=" +
                Date.now(),
                {
                    method:"GET",

                    headers:headers,

                    credentials:"include",

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    ()=>({})
                );


        if(
            response.ok &&
            data &&
            data.authenticated === true &&
            data.user
        ){

            showLoggedIn();


            try{

                localStorage.setItem(
                    "panelmarket_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }catch(error){

                console.warn(
                    "Kullanıcı bilgisi kaydedilemedi:",
                    error
                );

            }

        }else{

            showLoggedOut();

        }


    }catch(error){

        console.error(
            "Oturum kontrolü başarısız:",
            error
        );


        if(token){

            showLoggedIn();

        }else{

            showLoggedOut();

        }

    }

}

async function logoutUser(){

    const token =

    try{

        };

/* =========================================
   API ÜRÜN CEVABINI NORMALLEŞTİR
========================================= */

function normalizeProductResponse(data){

    if(!data){

        return null;

    }


    if(
        data.product &&
        typeof data.product === "object"
    ){

        return data.product;

    }


    if(
        data.data &&
        !Array.isArray(data.data) &&
        typeof data.data === "object"
    ){

        if(
            data.data.id ||
            data.data.name ||
            data.data.title
        ){

            return data.data;

        }

    }


    if(
        data.id ||
        data.name ||
        data.title
    ){

        return data;

    }


    return null;

}


/* =========================================
   API'DEN ÜRÜN GETİR
========================================= */

async function getProduct(){

    const productId =
        getProductId();


    if(!productId){

        throw new Error(
            "Ürün ID bulunamadı."
        );

    }


    try{

        const response =
            await fetch(

                "/api/products/" +

                encodeURIComponent(
                    productId
                ) +

                "?t=" +

                Date.now(),

                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    credentials:"include",

                    cache:"no-store"
                }

            );


        const data =
            await response
                .json()
                .catch(
                    ()=>null
                );


        const directProduct =
            normalizeProductResponse(
                data
            );


        if(
            response.ok &&
            directProduct
        ){

            return directProduct;

        }

    }catch(error){

        console.warn(
            "Direkt ürün API isteği başarısız:",
            error
        );

    }


    const response =
        await fetch(
            "/api/products?t=" +
            Date.now(),
            {
                method:"GET",

                headers:{
                    "Accept":
                        "application/json"
                },

                credentials:"include",

                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "Ürünler API'den alınamadı. HTTP " +
            response.status
        );

    }


    const data =
        await response
            .json()
            .catch(
                ()=>null
            );


    let products = [];


    if(Array.isArray(data)){

        products = data;

    }else if(
        data &&
        Array.isArray(data.products)
    ){

        products =
            data.products;

    }else if(
        data &&
        Array.isArray(data.data)
    ){

        products =
            data.data;

    }else if(
        data &&
        data.data &&
        Array.isArray(data.data.products)
    ){

        products =
            data.data.products;

    }


    const product =
        products.find(
            function(item){

                return String(
                    item?.id ?? ""
                ) === String(
                    productId
                );

            }
        );


    if(!product){

        throw new Error(
            "Ürün bulunamadı."
        );

    }


    return product;

}


/* =========================================
   DEĞERİ GEÇERLİ ID OLARAK AL
========================================= */

function validId(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    if(
        typeof value === "object"
    ){

        return String(
            value.id ??
            value.licenseId ??
            value.license_id ??
            value.packageId ??
            value.package_id ??
            value.key ??
            ""
        ).trim();

    }


    return String(value).trim();

}


/* =========================================
   LİSANS ID BUL
   TÜM OLASI API YAPILARI
========================================= */

function findLicenseId(product){

    if(
        !product ||
        typeof product !== "object"
    ){

        return "";

    }


    /* -------------------------------------
       DOĞRUDAN ALANLAR
    ------------------------------------- */

    const directValues = [

        product.licenseId,

        product.license_id,

        product.licenseID,

        product.license_id_value,

        product.packageId,

        product.package_id,

        product.packageID,

        product.selectedLicenseId,

        product.selected_license_id,

        product.selectedPackageId,

        product.selected_package_id,

        product.licenseKey,

        product.license_key

    ];


    for(const value of directValues){

        const id =
            validId(value);


        if(id){

            return id;

        }

    }


    /* -------------------------------------
       NESNE OLARAK LİSANS
    ------------------------------------- */

    const licenseObjects = [

        product.license,

        product.selectedLicense,

        product.selected_license,

        product.selectedPackage,

        product.selected_package,

        product.licenseOption,

        product.license_option,

        product.package,

        product.selectedPlan,

        product.selected_plan

    ];


    for(
        const licenseObject
        of licenseObjects
    ){

        if(
            licenseObject &&
            typeof licenseObject === "object"
        ){

            const id =
                validId(
                    licenseObject.id
                ) ||

                validId(
                    licenseObject.licenseId
                ) ||

                validId(
                    licenseObject.license_id
                ) ||

                validId(
                    licenseObject.packageId
                ) ||

                validId(
                    licenseObject.package_id
                );


            if(id){

                return id;

            }

        }

    }


    /* -------------------------------------
       LİSANS LİSTELERİ
    ------------------------------------- */

    const lists = [

        product.licenses,

        product.licenseOptions,

        product.license_options,

        product.licenseList,

        product.license_list,

        product.packages,

        product.licensePackages,

        product.license_packages,

        product.plans,

        product.options

    ];


    for(
        const list
        of lists
    ){

        if(
            !Array.isArray(list) ||
            list.length === 0
        ){

            continue;

        }


        for(
            const item
            of list
        ){

            const id =
                validId(item);


            if(id){

                return id;

            }

        }

    }


    /* -------------------------------------
       NESTED DATA
    ------------------------------------- */

    if(
        product.data &&
        typeof product.data === "object"
    ){

        const nestedId =
            findLicenseId(
                product.data
            );


        if(nestedId){

            return nestedId;

        }

    }


    return "";

}


/* =========================================
   LİSANS ADI BUL
========================================= */

function findLicenseName(product){

    if(
        !product ||
        typeof product !== "object"
    ){

        return "1 Site";

    }


    const directNameValues = [

        product.licenseName,

        product.license_name,

        product.licenseTitle,

        product.license_title,

        product.packageName,

        product.package_name,

        product.selectedLicenseName,

        product.selected_license_name,

        product.planName,

        product.plan_name

    ];


    for(
        const value
        of directNameValues
    ){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return String(value).trim();

        }

    }


    const objectValues = [

        product.license,

        product.selectedLicense,

        product.selected_license,

        product.package,

        product.selectedPackage,

        product.selected_package

    ];


    for(
        const object
        of objectValues
    ){

        if(
            object &&
            typeof object === "object"
        ){

            const name =

                object.name ||

                object.title ||

                object.licenseName ||

                object.license_name ||

                object.packageName ||

                object.package_name ||

                "";


            if(String(name).trim()){

                return String(name).trim();

            }

        }

    }


    const lists = [

        product.licenses,

        product.licenseOptions,

        product.license_options,

        product.packages,

        product.licensePackages,

        product.license_packages

    ];


    for(
        const list
        of lists
    ){

        if(
            Array.isArray(list) &&
            list.length > 0
        ){

            const first =
                list[0];


            if(
                first &&
                typeof first === "object"
            ){

                const name =

                    first.name ||

                    first.title ||

                    first.licenseName ||

                    first.license_name ||

                    first.packageName ||

                    first.package_name ||

                    "";


                if(String(name).trim()){

                    return String(name).trim();

                }

            }

        }

    }


    return "1 Site";

}


/* =========================================
   LİSANS ANA BİLGİSİ
========================================= */

function getLicenseInfo(product){

    const id =
        findLicenseId(
            product
        );


    const name =
        findLicenseName(
            product
        );


    let key = "";


    if(
        product &&
        typeof product === "object"
    ){

        key =

            validId(
                product.licenseKey
            ) ||

            validId(
                product.license_key
            ) ||

            validId(
                product.packageKey
            ) ||

            validId(
                product.package_key
            ) ||

            id;

    }


    return {

        id:
            id,

        name:
            name || "1 Site",

        key:
            key || id

    };

}

/* =========================================
   DEĞERLENDİRME SİSTEMİ
========================================= */

let selectedRating = 0;
let reviewData = null;

function ratingStars(value, empty = "☆"){
    const n = Math.max(0, Math.min(5, Math.round(Number(value) || 0)));
    return "★".repeat(n) + empty.repeat(5 - n);
}

function selectRating(rating){
    selectedRating = Number(rating);
    document.querySelectorAll("#ratingPicker .rating-star").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.rating) <= selectedRating);
    });
}

function reviewAuthHeaders(){
    const token = localStorage.getItem("panelmarket_token");
    return token ? { "Authorization": "Bearer " + token } : {};
}

function isLoggedInForReview(){
    return Boolean(localStorage.getItem("panelmarket_token"));
}

function updateReviewFormState(){
    const note = document.getElementById("reviewLoginNote");
    const submit = document.getElementById("reviewSubmit");
    if (!note || !submit) return;

    if (isLoggedInForReview()){
        note.textContent = "Puanınızı seçip deneyiminizi paylaşabilirsiniz.";
        submit.disabled = false;
        submit.style.opacity = "1";
    } else {
        note.innerHTML = '<a href="/login.html" style="color:#5eacff;font-weight:800;">Giriş yapın</a> ve değerlendirme bırakın.';
        submit.disabled = false;
    }
}

function renderReviewBars(distribution, count){
    const box = document.getElementById("reviewBars");
    if (!box) return;
    const total = Number(count || 0);
    box.innerHTML = [5,4,3,2,1].map(star => {
        const n = Number(distribution?.[star] || 0);
        const pct = total ? (n / total) * 100 : 0;
        return `
            <div class="review-bar">
                <span>${star}★</span>
                <div class="review-bar-track"><div class="review-bar-fill" style="width:${pct}%"></div></div>
                <span>${n}</span>
            </div>
        `;
    }).join("");
}

function renderOneReply(reply){
    return `
        <div class="review-reply">
            <div class="review-head">
                <span class="review-author">${escapeHtml(reply.username || "Kullanıcı")}</span>
                <span class="review-meta">${escapeHtml(reply.relativeTime || "")}</span>
            </div>
            <div class="review-comment" style="margin-top:5px;">${escapeHtml(reply.comment || "")}</div>
            <div class="review-actions">
                <button class="review-action ${reply.viewerVote === "like" ? "active" : ""}" onclick="voteReview(${reply.id},'like')">👍 ${Number(reply.likes || 0)}</button>
                <button class="review-action ${reply.viewerVote === "dislike" ? "active" : ""}" onclick="voteReview(${reply.id},'dislike')">👎 ${Number(reply.dislikes || 0)}</button>
            </div>
        </div>
    `;
}

function renderReview(item){
    const replies = (item.replies || []).map(renderOneReply).join("");
    return `
        <article class="review-item">
            <div class="review-head">
                <div>
                    <div class="review-author">${escapeHtml(item.username || "Kullanıcı")}</div>
                    <div class="review-item-stars">${ratingStars(item.rating)}</div>
                </div>
                <div class="review-meta">${escapeHtml(item.relativeTime || "")}</div>
            </div>

            <div class="review-comment">${escapeHtml(item.comment || "")}</div>

            <div class="review-actions">
                <button class="review-action ${item.viewerVote === "like" ? "active" : ""}" onclick="voteReview(${item.id},'like')">👍 ${Number(item.likes || 0)}</button>
                <button class="review-action ${item.viewerVote === "dislike" ? "active" : ""}" onclick="voteReview(${item.id},'dislike')">👎 ${Number(item.dislikes || 0)}</button>
                <button class="review-action" onclick="toggleReply(${item.id})">↩️ Cevapla</button>
            </div>

            <div id="replyForm-${item.id}" class="review-reply-form" style="display:none;">
                <input id="replyInput-${item.id}" class="review-reply-input" maxlength="2000" placeholder="Cevabınızı yazın...">
                <button class="btn primary" type="button" onclick="submitReply(${item.id})">Gönder</button>
            </div>

            ${replies ? `<div class="review-replies">${replies}</div>` : ""}
        </article>
    `;
}

function renderReviews(data){
    reviewData = data || {};
    const average = Number(data?.averageRating || 0);
    const count = Number(data?.reviewCount || 0);

    const avgEl = document.getElementById("reviewAverage");
    const starsEl = document.getElementById("reviewAverageStars");
    const countEl = document.getElementById("reviewCount");
    const list = document.getElementById("reviewsList");

    if (avgEl) avgEl.textContent = average.toFixed(1).replace(".", ",");
    if (starsEl) starsEl.textContent = ratingStars(average);
    if (countEl) countEl.textContent = `${count} değerlendirme`;
    renderReviewBars(data?.distribution || {}, count);

    if (!list) return;

    const reviews = Array.isArray(data?.reviews) ? data.reviews : [];
    if (!reviews.length){
        list.innerHTML = '<div class="reviews-empty">Henüz değerlendirme yok. İlk değerlendirmeyi siz bırakın.</div>';
        return;
    }
    list.innerHTML = reviews.map(renderReview).join("");
}

async function loadReviews(productId){
    try{
        const response = await fetch("/api/reviews/" + encodeURIComponent(productId) + "?t=" + Date.now(), {
            headers: { "Accept":"application/json" },
            credentials:"include",
            cache:"no-store"
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "Değerlendirmeler alınamadı.");
        renderReviews(data);
        updateReviewFormState();
    }catch(error){
        console.error("Değerlendirme yükleme hatası:", error);
        const list = document.getElementById("reviewsList");
        if (list) list.innerHTML = `<div class="reviews-error">${escapeHtml(error.message || "Değerlendirmeler alınamadı.")}</div>`;
    }
}

async function submitReview(){
    if (!isLoggedInForReview()){
        window.location.href = "/login.html";
        return;
    }
    const productId = String(window.currentProduct?.id || "");
    const commentEl = document.getElementById("reviewComment");
    const submit = document.getElementById("reviewSubmit");
    const comment = String(commentEl?.value || "").trim();

    if (!productId) return alert("Ürün bilgisi hazır değil.");
    if (!selectedRating) return alert("Lütfen 1 ile 5 arasında puan seçin.");
    if (!comment) return alert("Lütfen yorumunuzu yazın.");

    try{
        submit.disabled = true;
        const response = await fetch("/api/reviews", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Accept":"application/json",
                ...reviewAuthHeaders()
            },
            credentials:"include",
            body:JSON.stringify({ productId, rating:selectedRating, comment })
        });
        const data = await response.json();
        if (response.status === 401){
            window.location.href = "/login.html";
            return;
        }
        if (!response.ok || !data.ok) throw new Error(data.error || "Değerlendirme kaydedilemedi.");

        commentEl.value = "";
        selectRating(0);
        await loadReviews(productId);
    }catch(error){
        alert(error.message || "Değerlendirme kaydedilemedi.");
    }finally{
        submit.disabled = false;
    }
}

   SEPETE EKLE
   KESİN LİSANS FIX
========================================= */

function addToCart(){

    const product =
        window.currentProduct;


    if(
        !product ||
        !product.id
    ){

        alert(
            "Ürün bilgileri henüz yüklenmedi."
        );

        return;

    }


    /*
     * LİSANS ID'Yİ TEKRAR KONTROL ET.
     */

    let licenseId =
        String(
            product.licenseId ||
            product.license_id ||
            ""
        ).trim();


    /*
     * Gerekirse gerçek API ürününden
     * tekrar bul.
     */

    if(
        !licenseId &&
        window.__panelmarketProduct
    ){

        licenseId =
            findLicenseId(
                window.__panelmarketProduct
            );

    }


    /*
     * Lisans adı
     */

    const licenseName =
        String(
            product.licenseName ||
            product.license ||
            findLicenseName(
                window.__panelmarketProduct || product
            ) ||
            "1 Site"
        ).trim();


    /*
     * Lisans anahtarı
     */

    const licenseKey =
        String(
            product.licenseKey ||
            product.license_key ||
            licenseId ||
            ""
        ).trim();


    /*
     * Gerçek ID yoksa BOŞ lisanslı
     * sepet oluşturma.
     */

    if(!licenseId){

        console.error(
            "PanelMarket: Üründe lisans ID bulunamadı.",
            window.__panelmarketProduct
        );


        alert(
            "Bu ürün için geçerli lisans bilgisi alınamadı. Ürün lisans tanımı kontrol edilmelidir."
        );

        return;

    }


    const cart = {

        productId:
            String(
                product.id
            ),

        productName:
            String(
                product.name ||
                "Ürün"
            ),

        price:
            Number(
                product.price || 0
            ),

        image_url:
            String(
                product.image_url ||
                ""
            ),

        licenseName:
            licenseName,

        license:
            licenseName,

        licenseId:
            licenseId,

        license_id:
            licenseId,

        licenseKey:
            licenseKey,

        license_key:
            licenseKey

    };


    try{

        /*
         * SEPETE KAYDET
         */

        localStorage.setItem(
            "panelmarket_cart",
            JSON.stringify(
                cart
            )
        );


        /*
         * ESKİ LİSANS SİSTEMİYLE UYUMLULUK
         */

        localStorage.setItem(
            "panelmarket_selected_license",
            JSON.stringify({

                name:
                    licenseName,

                id:
                    licenseId,

                key:
                    licenseKey

            })
        );


        /*
         * KAYDIN GERÇEKTEN YAPILDIĞINI KONTROL ET
         */

        const savedCart =
            JSON.parse(
                localStorage.getItem(
                    "panelmarket_cart"
                ) || "null"
            );


        if(
            !savedCart ||
            String(
                savedCart.productId || ""
            ) !== String(
                product.id
            ) ||
            String(
                savedCart.licenseId || ""
            ) !== String(
                licenseId
            )
        ){

            throw new Error(
                "Sepet lisans bilgisi doğrulanamadı."
            );

        }


        console.log(
            "PanelMarket sepet kaydı:",
            savedCart
        );


        const message =
            document.getElementById(
                "cartMessage"
            );


        if(message){

            message.style.display =
                "block";


            message.innerHTML = `

                Ürün sepete eklendi.
                <br><br>

                <a
                    href="/sepet.html"
                    style="
                        color:#fff;
                        font-weight:900;
                        text-decoration:underline;
                    "
                >
                    SEPETE GİT
                </a>

            `;

        }


        setTimeout(
            function(){

                window.location.href =
                    "/sepet.html";

            },
            250
        );


    }catch(error){

        console.error(
            "Sepete ekleme hatası:",
            error
        );


        alert(
            "Ürün sepete eklenemedi. Lütfen tekrar deneyin."
        );

    }

}
