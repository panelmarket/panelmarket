<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün - PanelMarket</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#080d16;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font:inherit;
}

.header{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    min-height:76px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

header{
    border-bottom:1px solid #172131;
    background:#080d16;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:800;
    white-space:nowrap;
}

.logo-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1677ff;
    color:#fff;
    font-size:17px;
    font-weight:900;
}

nav{
    display:flex;
    align-items:center;
    gap:28px;
}

nav a{
    color:#9aa7b8;
    font-size:13px;
    font-weight:700;
}

nav a:hover{
    color:#fff;
}

#headerButtons{
    display:flex;
    align-items:center;
}

#guestButtons,
#userButtons{
    display:flex;
    align-items:center;
    gap:10px;
}

#guestButtons .btn,
#userButtons .btn{
    box-sizing:border-box;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    height:42px;
    padding:11px 16px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

#guestButtons .btn.outline,
#userButtons .btn.outline{
    border:1px solid #273241;
}

#guestButtons .btn.blue,
#userButtons .btn.blue{
    border:1px solid #1677ff;
}

#userButtons button.btn{
    font-family:inherit;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
}

main{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:45px 24px 70px;
}

.product-wrapper{
    display:grid;
    grid-template-columns:minmax(0,1fr) 390px;
    gap:30px;
}

.product-card,
.buy-card{
    background:#0d1521;
    border:1px solid #1b2839;
    border-radius:16px;
}

.product-card{
    padding:34px;
}

.product-category{
    display:inline-flex;
    align-items:center;
    min-height:30px;
    padding:7px 11px;
    border-radius:8px;
    background:#111f34;
    border:1px solid #1d3659;
    color:#5da2ff;
    font-size:11px;
    font-weight:800;
    margin-bottom:18px;
}

.product-title{
    margin:0 0 15px;
    font-size:32px;
    line-height:1.15;
    font-weight:900;
}

.product-description{
    margin:0;
    color:#9aa7b8;
    font-size:14px;
    line-height:1.7;
}

.info-grid{
    margin-top:32px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.info-box{
    padding:18px;
    background:#09111d;
    border:1px solid #192638;
    border-radius:12px;
}

.info-label{
    color:#718096;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.info-value{
    color:#fff;
    font-size:14px;
    font-weight:800;
}

.buy-card{
    padding:27px;
    align-self:start;
    position:sticky;
    top:20px;
}

.buy-title{
    margin:0 0 20px;
    font-size:18px;
    font-weight:900;
}

.license-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.license-option{
    position:relative;
}

.license-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.license-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    padding:16px;
    border:1px solid #263447;
    border-radius:11px;
    background:#09111d;
    cursor:pointer;
}

.license-option input:checked + .license-label{
    border-color:#1677ff;
    background:#0d1b2d;
}

.license-left{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.license-name{
    color:#fff;
    font-size:13px;
    font-weight:800;
}

.license-desc{
    color:#718096;
    font-size:11px;
}

.license-price{
    color:#5da2ff;
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}

.price-area{
    margin-top:25px;
    padding-top:22px;
    border-top:1px solid #1b2839;
}

.price-label{
    color:#718096;
    font-size:11px;
    font-weight:700;
    margin-bottom:7px;
}

.product-price{
    color:#fff;
    font-size:29px;
    font-weight:900;
}

.add-cart{
    width:100%;
    margin-top:20px;
    min-height:48px;
    border:1px solid #1677ff;
    border-radius:10px;
    background:#1677ff;
    color:#fff;
    font-size:13px;
    font-weight:900;
    cursor:pointer;
}

.add-cart:hover{
    background:#126be5;
}

.back-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-bottom:22px;
    color:#8492a5;
    font-size:12px;
    font-weight:700;
}

.back-link:hover{
    color:#fff;
}

@media(max-width:900px){
    .header{
        flex-wrap:wrap;
        padding:15px 18px;
    }

    nav{
        order:3;
        width:100%;
        justify-content:center;
        padding-bottom:5px;
        gap:20px;
    }

    .product-wrapper{
        grid-template-columns:1fr;
    }

    .buy-card{
        position:static;
    }
}

@media(max-width:800px){
    #guestButtons,
    #userButtons{
        gap:7px;
    }

    #guestButtons .btn,
    #userButtons .btn{
        min-height:40px;
        height:40px;
        padding:10px 13px;
        font-size:12px;
    }
}

@media(max-width:600px){
    main{
        padding:28px 15px 50px;
    }

    .header{
        padding-left:15px;
        padding-right:15px;
    }

    .product-card{
        padding:22px;
    }

    .product-title{
        font-size:25px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .buy-card{
        padding:21px;
    }

    nav{
        gap:14px;
    }

    nav a{
        font-size:11px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <a class="logo" href="/">
            <span class="logo-icon">P</span>
            PanelMarket
        </a>

        <nav>
            <a href="/index.html#urunler">Ürünler</a>
            <a href="/index.html#neden">Neden PanelMarket?</a>
            <a href="/destek.html">Destek</a>
        </nav>

        <div class="header-buttons" id="headerButtons">

            <div id="guestButtons" style="display:flex;gap:10px;align-items:center;">
                <a class="btn outline" href="/login.html">Giriş Yap</a>
                <a class="btn blue" href="/register.html">Kayıt Ol</a>
            </div>

            <div id="userButtons" style="display:none;gap:10px;align-items:center;">
                <a class="btn outline" href="/hesabim.html">Hesabım</a>
                <button class="btn blue" type="button" onclick="logoutUser()">Çıkış Yap</button>
            </div>

        </div>

    </div>
</header>

<main>

    <a class="back-link" href="/index.html#urunler">
        ← Ürünlere Dön
    </a>

    <div class="product-wrapper">

        <section class="product-card">

            <div class="product-category" id="productCategory">
                Admin Paneli
            </div>

            <h1 class="product-title" id="productName">
                Profesyonel Admin Paneli
            </h1>

            <p class="product-description" id="productDescription">
                Kullanıcı, içerik, ayar ve sistem yönetimi için modern yönetim paneli.
            </p>

            <div class="info-grid">

                <div class="info-box">
                    <div class="info-label">Teslimat</div>
                    <div class="info-value" id="deliveryInfo">Hemen</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Güncelleme</div>
                    <div class="info-value" id="updateInfo">1 Yıl</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Destek</div>
                    <div class="info-value" id="supportInfo">30 Gün</div>
                </div>

            </div>

        </section>

        <aside class="buy-card">

            <h2 class="buy-title">Lisans Seçimi</h2>

            <div class="license-list">

                <div class="license-option">
                    <input
                        type="radio"
                        name="license"
                        id="license1"
                        value="1-site"
                        checked
                    >

                    <label class="license-label" for="license1">

                        <span class="license-left">
                            <span class="license-name">1 Site</span>
                            <span class="license-desc">Tek site için kullanım</span>
                        </span>

                        <span class="license-price" id="price1">
                            1.499 TL
                        </span>

                    </label>
                </div>

                <div class="license-option">
                    <input
                        type="radio"
                        name="license"
                        id="license3"
                        value="3-site"
                    >

                    <label class="license-label" for="license3">

                        <span class="license-left">
                            <span class="license-name">3 Site</span>
                            <span class="license-desc">3 farklı site için kullanım</span>
                        </span>

                        <span class="license-price" id="price3">
                            2.499 TL
                        </span>

                    </label>
                </div>

                <div class="license-option">
                    <input
                        type="radio"
                        name="license"
                        id="licenseUnlimited"
                        value="unlimited"
                    >

                    <label class="license-label" for="licenseUnlimited">

                        <span class="license-left">
                            <span class="license-name">Sınırsız</span>
                            <span class="license-desc">Sınırsız site için kullanım</span>
                        </span>

                        <span class="license-price" id="priceUnlimited">
                            4.999 TL
                        </span>

                    </label>
                </div>

            </div>

            <div class="price-area">

                <div class="price-label">
                    Toplam Fiyat
                </div>

                <div class="product-price" id="productPrice">
                    1.499 TL
                </div>

            </div>

            <button
                class="add-cart"
                id="addToCart"
                type="button"
            >
                Sepete Ekle
            </button>

        </aside>

    </div>

</main>

<script>
const products={
    "admin-panel":{
        name:"Profesyonel Admin Paneli",
        category:"Admin Paneli",
        description:"Kullanıcı, içerik, ayar ve sistem yönetimi için modern yönetim paneli.",
        price:1499,
        delivery:"Hemen",
        update:"1 Yıl",
        support:"30 Gün"
    },

    "ecommerce-panel":{
        name:"E-Ticaret Yönetim Paneli",
        category:"E-Ticaret",
        description:"Ürün, sipariş, müşteri, stok ve mağaza yönetimi için kapsamlı panel.",
        price:2799,
        delivery:"Hemen",
        update:"1 Yıl",
        support:"60 Gün"
    },

    "company-panel":{
        name:"Firma Yönetim Paneli",
        category:"İşletme",
        description:"Firma bilgileri, çalışanlar, müşteriler ve raporlar için işletme paneli.",
        price:1799,
        delivery:"Hemen",
        update:"6 Ay",
        support:"30 Gün"
    },

    "finance-panel":{
        name:"Finans & Muhasebe Paneli",
        category:"Finans",
        description:"Gelir, gider, ödeme ve finansal raporları tek panel üzerinden yönetin.",
        price:2999,
        delivery:"24 Saat",
        update:"1 Yıl",
        support:"60 Gün"
    },

    "support-panel":{
        name:"Müşteri Destek Paneli",
        category:"Destek",
        description:"Ticket, müşteri talepleri ve destek süreçlerini yönetmek için hazır sistem.",
        price:1899,
        delivery:"Hemen",
        update:"1 Yıl",
        support:"90 Gün"
    },

    "stock-panel":{
        name:"Stok & Sipariş Paneli",
        category:"İşletme",
        description:"Stok takibi, sipariş yönetimi ve ürün kontrolü için profesyonel panel.",
        price:1999,
        delivery:"Hemen",
        update:"1 Yıl",
        support:"30 Gün"
    }
};

const params=new URLSearchParams(window.location.search);

const id=params.get("id") || "admin-panel";

const product=products[id] || products["admin-panel"];

document.getElementById("productName").textContent=product.name;
document.getElementById("productCategory").textContent=product.category;
document.getElementById("productDescription").textContent=product.description;
document.getElementById("deliveryInfo").textContent=product.delivery;
document.getElementById("updateInfo").textContent=product.update;
document.getElementById("supportInfo").textContent=product.support;

const prices={
    "1-site":product.price,
    "3-site":Math.round(product.price * 1.667),
    "unlimited":Math.round(product.price * 3.334)
};

function formatPrice(value){
    return value.toLocaleString("tr-TR") + " TL";
}

document.getElementById("price1").textContent=
    formatPrice(prices["1-site"]);

document.getElementById("price3").textContent=
    formatPrice(prices["3-site"]);

document.getElementById("priceUnlimited").textContent=
    formatPrice(prices["unlimited"]);

function updatePrice(){

    const selected=document.querySelector(
        'input[name="license"]:checked'
    );

    if(!selected){
        return;
    }

    const price=prices[selected.value];

    document.getElementById("productPrice").textContent=
        formatPrice(price);
}

document.querySelectorAll(
    'input[name="license"]'
).forEach(input=>{

    input.addEventListener("change",updatePrice);

});

document.getElementById("addToCart").onclick=()=>{

    const selected=document.querySelector(
        'input[name="license"]:checked'
    );

    if(!selected){
        alert("Lütfen bir lisans seçin.");
        return;
    }

    const licenseNameElement=
        selected.parentElement.querySelector(".license-name");

    const cart={
        productId:id,
        productName:product.name,
        licenseId:selected.value,
        licenseName:licenseNameElement
            ? licenseNameElement.textContent
            : selected.value,
        price:prices[selected.value]
    };

    localStorage.setItem(
        "panelmarket_cart",
        JSON.stringify(cart)
    );

    location.href="/sepet.html";
};

async function checkLogin(){

    const token=
        localStorage.getItem("panelmarket_token") ||
        sessionStorage.getItem("panelmarket_token") ||
        "";

    try{

        const headers={
            "Accept":"application/json"
        };

        if(token){
            headers.Authorization=
                "Bearer " + token;
        }

        const response=await fetch(
            "/api/auth/me?t=" + Date.now(),
            {
                method:"GET",
                headers,
                credentials:"include",
                cache:"no-store"
            }
        );

        const data=await response
            .json()
            .catch(()=>({}));

        if(
            response.ok &&
            data &&
            data.authenticated===true &&
            data.user
        ){

            showLoggedIn();

            try{

                localStorage.setItem(
                    "panelmarket_user",
                    JSON.stringify(data.user)
                );

            }catch{}

        }else{

            showLoggedOut();

        }

    }catch(error){

        console.error(
            "Oturum kontrolü başarısız:",
            error
        );

        const savedUser=
            localStorage.getItem(
                "panelmarket_user"
            );

        const savedToken=
            localStorage.getItem(
                "panelmarket_token"
            );

        if(savedUser && savedToken){

            showLoggedIn();

        }else{

            showLoggedOut();

        }
    }
}

function showLoggedIn(){

    const guestButtons=
        document.getElementById(
            "guestButtons"
        );

    const userButtons=
        document.getElementById(
            "userButtons"
        );

    if(guestButtons){
        guestButtons.style.display="none";
    }

    if(userButtons){
        userButtons.style.display="flex";
    }
}

function showLoggedOut(){

    const guestButtons=
        document.getElementById(
            "guestButtons"
        );

    const userButtons=
        document.getElementById(
            "userButtons"
        );

    if(guestButtons){
        guestButtons.style.display="flex";
    }

    if(userButtons){
        userButtons.style.display="none";
    }
}

async function logoutUser(){

    try{

        const token=
            localStorage.getItem(
                "panelmarket_token"
            ) ||
            sessionStorage.getItem(
                "panelmarket_token"
            ) ||
            "";

        const headers={
            "Accept":"application/json"
        };

        if(token){

            headers.Authorization=
                "Bearer " + token;

        }

        await fetch(
            "/api/logout",
            {
                method:"POST",
                headers,
                credentials:"include",
                cache:"no-store"
            }
        );

    }catch(error){

        console.error(
            "Çıkış API hatası:",
            error
        );

    }finally{

        try{

            localStorage.removeItem(
                "panelmarket_token"
            );

            localStorage.removeItem(
                "panelmarket_user"
            );

            sessionStorage.removeItem(
                "panelmarket_token"
            );

            sessionStorage.removeItem(
                "panelmarket_user"
            );

        }catch{}

        window.location.href="/index.html";
    }
}

checkLogin();
updatePrice();
</script>

</body>
</html>
