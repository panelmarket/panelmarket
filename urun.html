<script>


const content =
    document.getElementById("content");


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHtml(value){

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


/* =========================================
   FİYAT
========================================= */

function format(value){

    return Number(
        value || 0
    ).toLocaleString(
        "tr-TR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================
   OTURUM KONTROLÜ
   INDEX.HTML İLE AYNI
========================================= */

async function checkLogin(){

    const token =
        localStorage.getItem(
            "panelmarket_token"
        ) ||
        sessionStorage.getItem(
            "panelmarket_token"
        ) ||
        "";


    try{

        const headers = {
            "Accept":"application/json"
        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        const response =
            await fetch(
                "/api/auth/me?t=" + Date.now(),
                {
                    method:"GET",

                    headers,

                    credentials:"include",

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(()=>({}));


        if(
            response.ok &&
            data &&
            data.authenticated === true &&
            data.user
        ){

            showLoggedIn();


            try{

                localStorage.setItem(
                    "panelmarket_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }catch{}

        }else{

            showLoggedOut();

        }


    }catch(error){

        console.error(
            "Oturum kontrolü başarısız:",
            error
        );


        const savedUser =
            localStorage.getItem(
                "panelmarket_user"
            );


        const savedToken =
            localStorage.getItem(
                "panelmarket_token"
            );


        if(
            savedUser &&
            savedToken
        ){

            showLoggedIn();

        }else{

            showLoggedOut();

        }

    }

}


/* =========================================
   GİRİŞ YAPILMIŞ
========================================= */

function showLoggedIn(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );


    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.display =
            "none";

    }


    if(userButtons){

        userButtons.style.display =
            "flex";

    }

}


/* =========================================
   GİRİŞ YAPILMAMIŞ
========================================= */

function showLoggedOut(){

    const guestButtons =
        document.getElementById(
            "guestButtons"
        );


    const userButtons =
        document.getElementById(
            "userButtons"
        );


    if(guestButtons){

        guestButtons.style.display =
            "flex";

    }


    if(userButtons){

        userButtons.style.display =
            "none";

    }

}


/* =========================================
   ÇIKIŞ
========================================= */

async function logoutUser(){

    try{

        const token =
            localStorage.getItem(
                "panelmarket_token"
            ) ||
            sessionStorage.getItem(
                "panelmarket_token"
            ) ||
            "";


        const headers = {
            "Accept":"application/json"
        };


        if(token){

            headers.Authorization =
                "Bearer " + token;

        }


        await fetch(
            "/api/logout",
            {
                method:"POST",

                headers,

                credentials:"include",

                cache:"no-store"
            }
        );


    }catch(error){

        console.error(
            "Çıkış API hatası:",
            error
        );


    }finally{


        try{

            localStorage.removeItem(
                "panelmarket_token"
            );

            localStorage.removeItem(
                "panelmarket_user"
            );

            sessionStorage.removeItem(
                "panelmarket_token"
            );

            sessionStorage.removeItem(
                "panelmarket_user"
            );

        }catch{}


        showLoggedOut();


        window.location.href =
            "/index.html";

    }

}


/* =========================================
   SEPETİ TEMİZLE
========================================= */

function clearCart(){

    localStorage.removeItem(
        "panelmarket_cart"
    );

    location.reload();

}


/* =========================================
   ÜRÜN GÖRSELİ
========================================= */

function createProductImage(
    imageUrl,
    productName
){

    const url =
        String(
            imageUrl || ""
        ).trim();


    if(!url){

        return `

            <div class="image-fallback">
                ▣
            </div>

        `;

    }


    return `

        <img

            src="${escapeHtml(url)}"

            alt="${escapeHtml(
                productName || "Ürün"
            )}"

            onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block';
            "

        >

        <div
            class="image-fallback"
            style="display:none;"
        >
            ▣
        </div>

    `;

}


/* =========================================
   SEPET
========================================= */

async function loadCart(){


    let cart = null;


    try{

        cart = JSON.parse(

            localStorage.getItem(
                "panelmarket_cart"
            ) || "null"

        );


    }catch(error){

        console.error(
            "Sepet okunamadı:",
            error
        );


        localStorage.removeItem(
            "panelmarket_cart"
        );


        cart = null;

    }


    /* =====================================
       SEPET BOŞ
    ===================================== */

    if(!cart){

        content.innerHTML = `

            <div class="card empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Sepetiniz boş
                </h2>

                <p>
                    Satın almak için ürünlerden birini seçin.
                </p>

                <a
                    href="/index.html"
                    class="btn primary"
                >
                    ÜRÜNLERE GİT
                </a>

            </div>

        `;

        return;

    }


    let price =
        Number(
            cart.price || 0
        );


    let productName =
        cart.productName ||
        "Ürün";


    let licenseName =
        cart.licenseName ||
        "1 Site";


    let imageUrl =
        cart.image_url ||
        cart.imageUrl ||
        "";


    /* =====================================
       ÜRÜNÜ API'DEN TEKRAR ÇEK
    ===================================== */

    if(cart.productId){

        try{

            const response =
                await fetch(

                    "/api/products/" +

                    encodeURIComponent(
                        cart.productId
                    ) +

                    "?t=" +

                    Date.now(),

                    {

                        method:"GET",

                        headers:{
                            "Accept":
                                "application/json"
                        },

                        credentials:"include",

                        cache:"no-store"

                    }

                );


            const product =
                await response
                    .json()
                    .catch(
                        ()=>null
                    );


            if(
                response.ok &&
                product &&
                product.id
            ){

                productName =
                    product.name ||
                    productName;


                imageUrl =
                    product.image_url ||
                    product.imageUrl ||
                    imageUrl;


                if(
                    cart.price === undefined ||
                    cart.price === null ||
                    Number(cart.price) <= 0
                ){

                    price =
                        Number(
                            product.price || 0
                        );

                }


                cart.image_url =
                    imageUrl;


                cart.productName =
                    productName;


                try{

                    localStorage.setItem(

                        "panelmarket_cart",

                        JSON.stringify(
                            cart
                        )

                    );

                }catch(error){}

            }


        }catch(error){

            console.error(
                "Sepet ürün API hatası:",
                error
            );

        }

    }


    /* =====================================
       SEPETİ GÖSTER
    ===================================== */

    content.innerHTML = `

        <div class="cart">


            <!-- ÜRÜN -->

            <div class="card">

                <div class="product">


                    <div class="product-image">

                        ${createProductImage(
                            imageUrl,
                            productName
                        )}

                    </div>


                    <div class="product-info">

                        <div class="category">

                            PanelMarket Yazılım

                        </div>


                        <div class="product-name">

                            ${escapeHtml(
                                productName
                            )}

                        </div>


                        <div class="license">

                            Lisans:

                            <strong>

                                ${escapeHtml(
                                    licenseName
                                )}

                            </strong>

                        </div>

                    </div>


                    <div class="price">

                        <strong>

                            ₺${format(price)}

                        </strong>

                    </div>


                </div>

            </div>


            <!-- SİPARİŞ ÖZETİ -->

            <div class="card summary">


                <h2>
                    Sipariş Özeti
                </h2>


                <div class="row">

                    <span>
                        Ürün
                    </span>

                    <span>
                        ₺${format(price)}
                    </span>

                </div>


                <div class="row">

                    <span>
                        Lisans
                    </span>

                    <span>

                        ${escapeHtml(
                            licenseName
                        )}

                    </span>

                </div>


                <div class="row">

                    <span>
                        Ödeme
                    </span>

                    <span>
                        Bakiye
                    </span>

                </div>


                <div class="row total">

                    <span>
                        Toplam
                    </span>

                    <strong>
