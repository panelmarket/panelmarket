</nav>


<!--
    BURASI LOGIN.HTML İLE SENKRON
    panelmarket_token
    panelmarket_user
-->

<div
    class="header-buttons"
    id="authButtons"
>

    <!-- JS dolduracak -->

</div>


</div>

<main class="container">

</footer>


<script>

"use strict";


/* =========================================================
   LOGIN.HTML'DEKİ GERÇEK ANAHTARLAR
========================================================= */

const TOKEN_KEY =
    "panelmarket_token";

const USER_KEY =
    "panelmarket_user";


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

    try{

        return (
            localStorage.getItem(
                TOKEN_KEY
            ) || ""
        );

    }catch(error){

        console.error(
            "TOKEN OKUMA HATASI:",
            error
        );

        return "";

    }

}


/* =========================================================
   USER
========================================================= */

function getUser(){

    try{

        const raw =
            localStorage.getItem(
                USER_KEY
            );

        if(!raw){

            return null;

        }

        return JSON.parse(raw);

    }catch(error){

        console.error(
            "USER OKUMA HATASI:",
            error
        );

        return null;

    }

}


/* =========================================================
   LOGIN.HTML İLE AYNI OTURUM KONTROLÜ
========================================================= */

function isLoggedIn(){

    const token =
        getToken();

    const user =
        getUser();

    /*
       login.html başarılı girişte:

       localStorage.setItem(
           "panelmarket_token",
           data.token
       );

       localStorage.setItem(
           "panelmarket_user",
           JSON.stringify(data.user)
       );

       Bu yüzden ikisini birlikte kontrol ediyoruz.
    */

    return !!(
        token &&
        user
    );

}


/* =========================================================
   HEADER'I GÜNCELLE
========================================================= */

function updateAuthHeader(){

    const box =
        document.getElementById(
            "authButtons"
        );

    if(!box){

        return;

    }


    if(isLoggedIn()){

        box.innerHTML = `

            <a
                href="/hesabim.html"
                class="header-btn login"
            >
                HESABIM
            </a>

            <button
                type="button"
                class="header-btn logout"
                onclick="logoutUser()"
            >
                ÇIKIŞ YAP
            </button>

        `;

    }else{

        box.innerHTML = `

            <a
                href="/login.html"
                class="header-btn login"
            >
                GİRİŞ YAP
            </a>

            <a
                href="/register.html"
                class="header-btn register"
            >
                KAYIT OL
            </a>

        `;

    }

}


/* =========================================================
   ÇIKIŞ
========================================================= */

function logoutUser(){

    try{

        localStorage.removeItem(
            TOKEN_KEY
        );

        localStorage.removeItem(
            USER_KEY
        );

    }catch(error){

        console.error(
            "LOGOUT ERROR:",
            error
        );

    }


    /*
       Sunucu tarafındaki cookie/session
       varsa onu da kapatmayı deniyoruz.
    */

    fetch(
        "/api/logout",
        {
            method:"POST",
            credentials:"include"
        }
    ).catch(function(){});


    window.location.replace(
        "/login.html"
    );

}


/* =========================================================
   ORDER ID
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );

const orderId =
    params.get("id");


/* =========================================================
   ORDER YOK
========================================================= */

if(!orderId){

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="card error">

            <h2>
                Sipariş bulunamadı
            </h2>

            <p
                style="
                    margin-top:10px;
                    color:#8995a7
                "
            >
                Teslimat sayfasını bir sipariş
                üzerinden açmanız gerekiyor.
            </p>

            <br>

            <a
                href="/siparislerim.html"
                class="btn primary"
            >
                SİPARİŞLERİME GİT
            </a>

        </div>

    `;

}else{

    loadOrder();

}


/* =========================================================
   SİPARİŞ
========================================================= */

async function loadOrder(){


    /* ---------------------------------------------
       GERÇEK LOGIN KONTROLÜ
    --------------------------------------------- */

    if(!isLoggedIn()){

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="card error">

                <h2>
                    Giriş yapmanız gerekiyor
                </h2>

                <p
                    style="
                        margin-top:10px;
                        color:#8995a7
                    "
                >
                    Sipariş teslimatını görüntülemek
                    için PanelMarket hesabınıza giriş yapın.
                </p>

                <br>

                <a
                    href="/login.html"
                    class="btn primary"
                >
                    GİRİŞ YAP
                </a>

            </div>

        `;

        return;

    }


    try{


        const token =
            getToken();


        /*
           login.html'deki API sistemiyle uyumlu:
           Authorization + credentials include
        */

        const headers = {

            "Accept":
                "application/json"

        };


        if(token){

            headers[
                "Authorization"
            ] =
                "Bearer " + token;

        }


        const res =
            await fetch(

                "/api/orders/" +
                encodeURIComponent(
                    orderId
                ),

                {

                    method:"GET",

                    headers:headers,

                    credentials:"include",

                    cache:"no-store"

                }

            );


        let data = {};


        try{

            data =
                await res.json();

        }catch(error){

            data = {};

        }


        /* ---------------------------------------------
           OTURUM GEÇERSİZ
        --------------------------------------------- */

        if(
            res.status === 401 ||
            res.status === 403
        ){

            /*
               Token gerçekten geçersizse temizle.
            */

            localStorage.removeItem(
                TOKEN_KEY
            );

            localStorage.removeItem(
                USER_KEY
            );


            updateAuthHeader();


            document.getElementById(
                "content"
            ).innerHTML = `

                <div class="card error">

                    <h2>
                        Oturum geçersiz
                    </h2>

                    <p
                        style="
                            margin-top:10px;
                            color:#8995a7
                        "
                    >
                        Siparişinizi görüntülemek
                        için tekrar giriş yapın.
                    </p>

                    <br>

                    <a
                        href="/login.html"
                        class="btn primary"
                    >
                        GİRİŞ YAP
                    </a>

                </div>

            `;

            return;

        }


        if(!res.ok){

            throw new Error(

                data.error ||
                data.message ||
                "Sipariş bulunamadı."

            );

        }


        const order =
            data.order ||
            data;


        const product =
            order.productName ||
            order.product?.name ||
            "Panel";


        const license =
            order.licenseName ||
            order.license?.name ||
            "1 Site";


        const orderNumber =
            order.orderNumber ||
            order.id ||
            "-";


        const licenseKey =
            order.licenseKey ||
            order.license_key ||
            "";


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="card">


                <div class="center">


                    <div class="success-icon">
                        ✓
                    </div>


                    <h1>
                        Satın Alma Tamamlandı
                    </h1>


                    <p>
                        Paneliniz başarıyla
                        hesabınıza tanımlandı.
                    </p>


                </div>



                <div class="product">


                    <div class="product-title">

                        ${escapeHtml(
                            product
                        )}

                    </div>


                    <div class="product-category">

                        PanelMarket Lisanslı Ürün

                    </div>



                    <div class="details">


                        <div class="detail">

                            <div class="detail-label">
                                Sipariş No
                            </div>

                            <div class="detail-value">

                                ${escapeHtml(
                                    orderNumber
                                )}

                            </div>

                        </div>



                        <div class="detail">

                            <div class="detail-label">
                                Lisans
                            </div>

                            <div class="detail-value">

                                ${escapeHtml(
                                    license
                                )}

                            </div>

                        </div>



                        <div class="detail">

                            <div class="detail-label">
                                Durum
                            </div>

                            <div
                                class="detail-value"
                                style="color:#70e4a0"
                            >

                                ${escapeHtml(
                                    order.status ||
                                    "Tamamlandı"
                                )}

                            </div>

                        </div>



                        <div class="detail">

                            <div class="detail-label">
                                Tutar
                            </div>

                            <div class="detail-value">

                                ₺${format(
                                    order.amount ??
                                    order.price ??
                                    0
                                )}

                            </div>

                        </div>


                    </div>



                    <div class="key">


                        <div class="key-label">

                            LİSANS ANAHTARI

                        </div>


                        <div class="key-value">

                            ${escapeHtml(
                                licenseKey ||
                                "Lisans anahtarı oluşturulmadı"
                            )}

                        </div>


                    </div>



                    <div class="buttons">


                        <button
                            class="btn primary"
                            onclick="copyKey('${escapeJs(licenseKey)}')"
                        >

                            LİSANS ANAHTARINI KOPYALA

                        </button>


                        <a
                            href="/siparislerim.html"
                            class="btn secondary"
                        >

                            SİPARİŞLERİME GİT

                        </a>


                    </div>



                    <div class="notice">

                        <strong>
                            Satın alınan paneli teslim alma:
                        </strong>

                        <br><br>

                        Bu siparişin lisans anahtarı
                        hesabınıza tanımlanmıştır.

                        Gerçek panel ZIP dosyasının
                        indirilebilmesi için ilgili panel
                        dosyasının sunucuya eklenmesi gerekir.

                        Lisans anahtarı hazırdır ve
                        siparişiniz hesabınızda kayıtlıdır.

                    </div>


                </div>


            </div>

        `;


    }catch(e){


        console.error(
            "ORDER LOAD ERROR:",
            e
        );


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="card error">

                <h2>
                    Sipariş yüklenemedi
                </h2>

                <p
                    style="
                        margin-top:10px
                    "
                >

                    ${escapeHtml(
                        e.message
                    )}

                </p>

                <br>

                <a
                    href="/siparislerim.html"
                    class="btn primary"
                >
                    SİPARİŞLERİME GİT
                </a>

            </div>

        `;

    }

}


/* =========================================================
   COPY
========================================================= */

function copyKey(key){

    if(!key){

        alert(
            "Kopyalanacak lisans anahtarı bulunamadı."
        );

        return;

    }


    navigator.clipboard
        .writeText(key)

        .then(function(){

            alert(
                "Lisans anahtarı kopyalandı."
            );

        })

        .catch(function(){

            alert(
                "Kopyalama başarısız oldu."
            );

        });

}


/* =========================================================
   FORMAT
========================================================= */

function format(n){

    return Number(n)
        .toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(str){

    return String(
        str ?? ""
    ).replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJs(str){

    return String(
        str ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


/* =========================================================
   SAYFA AÇILIR AÇILMAZ HEADER
========================================================= */

updateAuthHeader();

</script>

</body>
</html>
